<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="shoepao-dev-admin" content="true">
    <title>Shoe Pao — Accounts</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        :root{--accent:#b71c1c;--muted:#666;--page-bg:#fafafa}
        body{font-family:'Poppins',Arial,sans-serif;margin:0;background:var(--page-bg);color:#222}
        .topbar{background:#fff;display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid #eee;position:sticky;top:0;z-index:50}
        .nav-left{display:flex;align-items:center;gap:22px;width:70%;max-width:820px}
        .nav-left-inner{display:flex;align-items:center;justify-content:space-between;width:100%}
        .logo-wrap{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
        .logo-wrap img{height:40px}
        .site-title{font-weight:600;color:var(--accent);font-size:1.05rem}
        .nav-item{font-size:0.98rem;font-weight:500;color:#222;cursor:pointer;text-decoration:none;padding:8px 12px;border-radius:6px}
        .nav-item:hover{color:var(--accent)}
        .nav-right{display:flex;align-items:center;gap:12px}
        .profile-btn{background:none;border:0;padding:6px;cursor:pointer}
        .profile-btn img{width:34px;height:34px}
        .container{max-width:1100px;margin:28px auto;padding:20px}
        .page-title{font-size:1.6rem;font-weight:700;margin-bottom:6px}
        .sub{color:var(--muted);margin-bottom:12px}
        table.accounts-table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #eee;border-radius:8px;overflow:hidden}
        table.accounts-table th, table.accounts-table td{padding:12px 14px;border-bottom:1px solid #f0f0f0;text-align:left}
        table.accounts-table thead th{background:#fafafa;font-weight:700}
        .empty{color:#666;padding:24px;text-align:center}
        .action-link{color:var(--accent);text-decoration:none;font-weight:600}
    .search-row{display:flex;gap:8px;margin-bottom:12px;align-items:center}
    /* visually prominent white search box with black outline */
    .search-box{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #000;border-radius:10px;padding:6px 8px;box-shadow:none}
    .search-icon{width:20px;height:20px;opacity:0.85}
    .search-input{flex:1;padding:10px 12px;border:0;background:transparent;border-radius:6px;outline:none;font-size:0.95rem;min-width:320px}
    </style>
</head>
<body>
    <header class="topbar">
        <div class="nav-left">
            <div class="nav-left-inner">
                <a class="logo-wrap" href="dashboard.html" aria-label="Shoe Pao dashboard">
                    <img src="IMAGE/SHOEPAOLOGO.png" alt="ShoePao logo">
                    <span class="site-title">Shoe Pao Footwear</span>
                </a>
                <a class="nav-item" href="dashboard.html">OVERVIEW</a>
                <a class="nav-item" href="orders.html">Orders</a>
                <a class="nav-item" href="inventory.html">Inventory</a>
                <a class="nav-item" href="accounts.html">Accounts</a>
            </div>
        </div>
        <!-- profile removed for admin UI -->
    </header>

    <main class="container">
        <div class="page-title">Accounts</div>
        <div class="sub">List of registered users. Click a row to view details and orders.</div>

        <div style="margin-bottom:12px;display:flex;gap:12px;align-items:center;justify-content:space-between;">
            <div style="flex:1 1 72%">
                <div class="search-row">
                    <div class="search-box" style="width:100%;">
                        <img src="IMAGE/SEARCHICON.png" class="search-icon" alt="Search">
                        <input id="accountsSearch" class="search-input" placeholder="Search by name, email, or phone number" aria-label="Search accounts" />
                    </div>
                </div>
            </div>
            <div style="display:flex;gap:8px;align-items:center;">
                <label for="typeFilter" style="font-size:0.95rem;color:#444">Type</label>
                <select id="typeFilter" style="padding:8px;border-radius:8px;border:1px solid #ddd;background:#fff">
                    <option value="all">All</option>
                    <option value="admin">Admin</option>
                    <option value="client">Client</option>
                </select>
                <label for="alphaSort" style="font-size:0.95rem;color:#444">Sort</label>
                <select id="alphaSort" style="padding:8px;border-radius:8px;border:1px solid #ddd;background:#fff">
                    <option value="none">Default</option>
                    <option value="az">A → Z</option>
                    <option value="za">Z → A</option>
                </select>
                <button id="createAccountBtn" style="margin-left:12px;padding:8px 12px;border-radius:8px;border:1px solid #000;background:#000;color:#fff;cursor:pointer;min-width:140px;white-space:nowrap;font-weight:400;font-size:0.95rem">Create Account</button>
            </div>
        </div>

        <div id="accountsWrap">
            <table class="accounts-table" id="accountsTable">
                <thead>
                    <tr>
                    <th>Full name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Type</th>
                    <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="accountsTbody">
                </tbody>
            </table>
        </div>

    </main>

    <!-- Firebase client SDK and site config (used to sync users and perform admin calls) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>

    <script>
    // Initialize Firebase client if not already initialized
    try{
        if(window.FIREBASE_CONFIG && (!window.firebase || !firebase.apps || firebase.apps.length === 0)){
            firebase.initializeApp(window.FIREBASE_CONFIG);
            console.log('Firebase initialized in accounts.html');
        }
    }catch(e){ console.warn('Firebase init failed', e); }

    (function(){
        function getUsers(){ try{ return JSON.parse(localStorage.getItem('users') || '[]') }catch(e){ return [] } }
        function formatName(u){ if(!u) return 'EMPTY'; var first = (u.firstName || u.name || '').trim(); var last = (u.lastName || '').trim(); var full = (first + (last ? (' ' + last) : '')).trim(); return full || 'EMPTY'; }

        function removeLocalDataForEmail(email){
            var lc = (email||'').toLowerCase();
            // profile
            try{
                var prof = JSON.parse(localStorage.getItem('profile')||'null');
                if(prof && (prof.email||'').toLowerCase() === lc){ localStorage.removeItem('profile'); localStorage.removeItem('profile_updated_at'); localStorage.removeItem('authToken'); localStorage.removeItem('authTokenUpdatedAt'); localStorage.removeItem('cart'); }
            }catch(e){}
            // orders
            try{
                 var orders = JSON.parse(localStorage.getItem('client_orders')||'[]') || [];
                orders = orders.filter(function(o){ var candidates = [o.email, o.customerEmail, (o.profile && o.profile.email), (o.customer && o.customer.email)]; return !candidates.some(function(c){ return (c||'').toLowerCase() === lc; }); });
                 localStorage.setItem('client_orders', JSON.stringify(orders));
            }catch(e){}
            // wishlists: handle array or object
            try{
                var wl = localStorage.getItem('wishlist');
                if(wl){
                    try{
                        var parsed = JSON.parse(wl);
                        if(Array.isArray(parsed)){
                            parsed = parsed.filter(function(w){ var owner = (w.ownerEmail||w.email||'').toLowerCase(); return owner !== lc; });
                            localStorage.setItem('wishlist', JSON.stringify(parsed));
                        } else if(typeof parsed === 'object'){
                            // remove keys matching email
                            Object.keys(parsed).forEach(function(k){ if(k.toLowerCase() === lc) delete parsed[k]; });
                            localStorage.setItem('wishlist', JSON.stringify(parsed));
                        }
                    }catch(e){ try{ localStorage.removeItem('wishlist'); }catch(e){} }
                }
            }catch(e){}
            // checkout
            try{
                var co = JSON.parse(localStorage.getItem('checkout')||'null');
                if(co && ((co.email||'').toLowerCase() === lc || (co.customerEmail||'').toLowerCase() === lc)){
                    localStorage.removeItem('checkout');
                }
            }catch(e){}
            // generic scan
            try{
                var keys = [];
                for(var i=0;i<localStorage.length;i++) keys.push(localStorage.key(i));
                keys.forEach(function(key){
                    if(!key) return;
                    if(['users','orders','wishlist','profile','cart','checkout','pendingFirebaseUserDeletions'].indexOf(key) !== -1) return;
                    try{
                        var v = localStorage.getItem(key);
                        if(!v || v.indexOf(lc) === -1) return;
                        var parsed = JSON.parse(v);
                        var changed = false;
                        if(Array.isArray(parsed)){
                            var filtered = parsed.filter(function(it){ try{ var s = JSON.stringify(it).toLowerCase(); return s.indexOf(lc) === -1; }catch(e){ return true; } });
                            if(filtered.length !== parsed.length){ localStorage.setItem(key, JSON.stringify(filtered)); }
                        } else if(typeof parsed === 'object'){
                            Object.keys(parsed).forEach(function(k){ try{ if(JSON.stringify(parsed[k]).toLowerCase().indexOf(lc) !== -1){ delete parsed[k]; changed = true; } }catch(e){} });
                            if(changed) localStorage.setItem(key, JSON.stringify(parsed));
                        }
                    }catch(e){}
                });
            }catch(e){}
        }

        function render(){
            var users = getUsers() || [];
            // Backfill missing user names from orders if possible (persist so it appears in profiles/accounts)
            try{
                var orders = JSON.parse(localStorage.getItem('client_orders')||'[]') || [];
                var didUpdate = false;
                users = users.map(function(u){
                    var hasName = (u.firstName && u.firstName.trim()) || (u.lastName && u.lastName.trim()) || (u.name && u.name.trim());
                    if(hasName) return u;
                    var email = (u.email||'').toLowerCase();
                    if(!email) return u;
                    var found = orders.find(function(o){
                        var candidates = [o.email, o.customerEmail, (o.profile && o.profile.email), (o.customer && o.customer.email)];
                        return candidates.some(function(c){ return (c||'').toLowerCase() === email; }) && o.customerName;
                    });
                    if(found && found.customerName){
                        // persist the name into user's name fields
                        var parts = (found.customerName||'').trim().split(/\s+/);
                        if(parts.length === 1){ u.firstName = parts[0]; }
                        else if(parts.length > 1){ u.firstName = parts.shift(); u.lastName = parts.join(' '); }
                        else { u.name = found.customerName; }
                        didUpdate = true;
                    }
                    return u;
                });
                if(didUpdate){ localStorage.setItem('users', JSON.stringify(users)); }
                }catch(e){ /* ignore */ }
            const tbody = document.getElementById('accountsTbody');
            tbody.innerHTML = '';
            if(!users || users.length===0){ document.getElementById('accountsWrap').innerHTML = '<div class="empty">No accounts found.</div>'; return; }
            const q = (document.getElementById('accountsSearch').value || '').toLowerCase().trim();
            const typeFilter = (document.getElementById('typeFilter').value || 'all');
            const alphaSort = (document.getElementById('alphaSort').value || 'none');

            // filter by search and type
            let filtered = users.filter(u=>{
                // type filter
                const role = (u.role||'').toLowerCase();
                if(typeFilter === 'admin' && role !== 'admin') return false;
                if(typeFilter === 'client' && role === 'admin') return false;
                // search
                if(!q) return true;
                const joined = (formatName(u) + ' ' + (u.email||'') + ' ' + (u.phone||'')).toLowerCase();
                return joined.indexOf(q) !== -1;
            });

            // Always show admins on top when viewing All; apply alphabetical sort within groups if requested
            const rolePriority = (u) => ((u.role||'').toLowerCase() === 'admin') ? 0 : 1;

            filtered.sort(function(a,b){
                // primary: role priority
                const pa = rolePriority(a), pb = rolePriority(b);
                if(pa !== pb) return pa - pb;
                // secondary: alphabetical if requested
                if(alphaSort === 'az' || alphaSort === 'za'){
                    const na = formatName(a).toLowerCase();
                    const nb = formatName(b).toLowerCase();
                    if(na < nb) return (alphaSort === 'az') ? -1 : 1;
                    if(na > nb) return (alphaSort === 'az') ? 1 : -1;
                    return 0;
                }
                // otherwise keep stable order (fallback to name asc)
                const na = formatName(a).toLowerCase();
                const nb = formatName(b).toLowerCase();
                return na < nb ? -1 : (na > nb ? 1 : 0);
            });

            filtered.forEach(u=>{
                const tr = document.createElement('tr');
                const name = formatName(u);
                const email = u.email || 'EMPTY';
                const phone = (u.phone || (u.deliveryAddress && u.deliveryAddress.phone) || 'EMPTY');
                const type = (u.role && u.role.toLowerCase() === 'admin') ? 'Admin' : 'Client';
                tr.innerHTML = '<td>' + name + '</td><td>' + email + '</td><td>' + phone + '</td><td>' + type + '</td><td>' +
                    '<a class="action-link" href="account-detail.html?email=' + encodeURIComponent(email) + '">View</a>' +
                    ' <button class="action-btn edit-btn" data-email="' + encodeURIComponent(email) + '" style="margin-left:8px;padding:6px 10px;border-radius:6px;border:1px solid #ddd;background:#fff;cursor:pointer">Edit</button>' +
                    ' <button class="action-btn delete-btn" data-email="' + encodeURIComponent(email) + '" style="margin-left:6px;padding:6px 10px;border-radius:6px;border:1px solid #b71c1c;background:#fff;color:#b71c1c;cursor:pointer">Delete</button>' +
                    '</td>';
                tr.style.cursor = 'pointer';
                tr.onclick = function(e){
                    // if clicked the link or a button, let that control handle it
                    if(e.target && e.target.tagName){
                        var t = e.target.tagName.toLowerCase();
                        if(t === 'a') return;
                        if(e.target.closest && e.target.closest('.action-btn')) return;
                    }
                    window.location.href = 'account-detail.html?email=' + encodeURIComponent(email);
                };
                tbody.appendChild(tr);
            });
        }

        document.getElementById('accountsSearch').addEventListener('input', function(){ render(); });
        var tf = document.getElementById('typeFilter'); if(tf) tf.addEventListener('change', function(){ render(); });
        var as = document.getElementById('alphaSort'); if(as) as.addEventListener('change', function(){ render(); });
        window.addEventListener('storage', function(e){ if(e.key === 'users' || e.key === 'orders') render(); });
    document.addEventListener('DOMContentLoaded', render);
    // expose render to other scripts so delete/edit can trigger an immediate refresh
    try{ window.renderAccountsTable = render; }catch(e){}
    try{ window.removeLocalDataForEmail = removeLocalDataForEmail; }catch(e){}
    })();
    </script>

    <script>
    // Server-backed accounts sync: client cannot read Firestore directly due to rules.
    (function(){
        async function fetchAccountsFromServer(){
            try{
                if(!window.firebase || !firebase.auth) { console.warn('Firebase auth not available for accounts sync'); return; }
                const user = firebase.auth().currentUser;
                if(!user) { console.warn('No signed-in user for accounts sync'); return; }
                let idToken = null;
                try{ idToken = await user.getIdToken(true); }catch(e){ console.warn('getIdToken failed', e); }
                if(!idToken) return;

                let resp = null;
                try{
                    resp = await fetch('http://127.0.0.1:3000/api/accounts', { headers: { 'Authorization': 'Bearer ' + idToken } });
                    if(!resp.ok){
                        // fall back to PHP proxy
                        resp = await fetch('server-proxy.php/api/accounts', { headers: { 'Authorization': 'Bearer ' + idToken } });
                    }
                }catch(e){ console.warn('accounts fetch failed', e); return; }

                if(!resp || !resp.ok) { console.warn('accounts endpoint returned non-ok', resp && resp.status); return; }
                const j = await resp.json();
                if(!j || !Array.isArray(j.accounts)) return;
                const map = {};
                j.accounts.forEach(function(d){
                    try{
                        const key = (d && d.uid) ? String(d.uid) : ((d && d.email) ? (d.email||'').toLowerCase() : null);
                        if(!key) return;
                        if(d.email) d.email = (d.email||'').toLowerCase();
                        map[key] = Object.assign({}, map[key] || {}, d);
                    }catch(e){}
                });
                const mergedList = Object.keys(map).map(k => map[k]);
                localStorage.setItem('users', JSON.stringify(mergedList));
                try{ if(typeof window.renderAccountsTable === 'function') window.renderAccountsTable(); }catch(e){}
            }catch(e){ console.warn('fetchAccountsFromServer failed', e); }
        }

        // initial fetch and periodic refresh
        (async function(){
            try{ if(window.PageDataGate && PageDataGate.block) PageDataGate.block('Loading accounts...'); }catch(e){}
            try{ await fetchAccountsFromServer(); }catch(e){ console.warn('accounts initial fetch failed', e); }
            try{ if(window.PageDataGate && PageDataGate.ready) PageDataGate.ready(); }catch(e){}
            try{ setInterval(fetchAccountsFromServer, 10000); }catch(e){ console.warn('accounts sync init failed', e); }
        })();
    })();
    </script>

    <script>
    // Utility used by modal phone input
    function formatPhone(input) {
        var value = (input.value||'').replace(/\D/g, '');
        var formatted = '';
        if (value.length > 0) formatted += value.substring(0,3);
        if (value.length > 3) formatted += ' ' + value.substring(3,6);
        if (value.length > 6) formatted += ' ' + value.substring(6,10);
        input.value = formatted;
    }

    // Modal + create/edit/delete wiring
    (function(){
        var modalHtml = '\n<div id="accountModal" style="display:none;position:fixed;inset:0;z-index:20000;align-items:center;justify-content:center;">' +
            '<div id="modalOverlay" style="position:absolute;inset:0;background:rgba(0,0,0,0.5)"></div>' +
            '<div style="position:relative;max-width:560px;width:94%;background:#fff;border-radius:10px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,0.15);z-index:20001">' +
            '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">' +
            '<div style="font-weight:700;font-size:1.15rem" id="modalTitle">Create account</div>' +
            '<button id="closeModalBtn" style="background:none;border:0;font-size:1.2rem;cursor:pointer">✕</button>' +
            '</div>' +
            '<form id="accountForm" autocomplete="off" style="display:block">' +
            '<div style="display:flex;gap:10px;margin-bottom:8px">' +
            '<input id="firstName_m" placeholder="First name" required style="flex:1;padding:10px;border:1px solid #ddd;border-radius:6px">' +
            '<input id="lastName_m" placeholder="Last name" style="flex:1;padding:10px;border:1px solid #ddd;border-radius:6px">' +
            '</div>' +
            '<div style="margin-bottom:8px"><input id="email_m" type="email" autocomplete="username" placeholder="Email" required style="width:100%;padding:10px;border:1px solid #ddd;border-radius:6px"></div>' +
            '<div style="margin-bottom:8px"><input id="phone_m" placeholder="Phone (xxx xxx xxxx)" maxlength="12" oninput="formatPhone(this)" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:6px"></div>' +
            '<div style="margin-bottom:8px"><input id="password_m" type="password" autocomplete="new-password" placeholder="Password (leave blank to keep existing)" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:6px"></div>' +
            '<div style="margin-bottom:12px"><label for="role_m">Role</label> <select id="role_m" style="margin-left:8px;padding:8px;border-radius:6px;border:1px solid #ddd"><option value="client">Client</option><option value="admin">Admin</option></select></div>' +
            '<div style="display:flex;gap:8px;justify-content:flex-end">' +
            '<button type="button" id="cancelModal" style="padding:8px 12px;border-radius:6px;border:1px solid #ddd;background:#fff;cursor:pointer">Cancel</button>' +
            '<button type="submit" id="saveAccountBtn" style="padding:8px 14px;border-radius:6px;border:0;background:#000;color:#fff;cursor:pointer">Save</button>' +
            '</div>' +
            '</form>' +
            '</div></div>\n';
        document.body.insertAdjacentHTML('beforeend', modalHtml);
        var modal = document.getElementById('accountModal');
        var closeBtn = document.getElementById('closeModalBtn');
        var cancelBtn = document.getElementById('cancelModal');
        var form = document.getElementById('accountForm');
        var modalTitle = document.getElementById('modalTitle');
        var createBtn = document.getElementById('createAccountBtn');
    var currentMode = 'create';
    var editingEmail = null;

        function openAccountModal(mode, email){
            currentMode = mode || 'create';
            editingEmail = email || null;
            modalTitle.textContent = (currentMode === 'create') ? 'Create account' : 'Edit account';
            document.getElementById('firstName_m').value = '';
            document.getElementById('lastName_m').value = '';
            document.getElementById('email_m').value = '';
            document.getElementById('phone_m').value = '';
            document.getElementById('password_m').value = '';
            document.getElementById('role_m').value = 'client';
            if(currentMode === 'edit' && editingEmail){
                try{
                    var users = JSON.parse(localStorage.getItem('users')||'[]')||[];
                    var u = users.find(function(x){ return (x.email||'').toLowerCase() === (decodeURIComponent(editingEmail)||'').toLowerCase(); });
                    if(u){
                        document.getElementById('firstName_m').value = u.firstName || u.name || '';
                        document.getElementById('lastName_m').value = u.lastName || '';
                        document.getElementById('email_m').value = u.email || '';
                        document.getElementById('phone_m').value = u.phone || '';
                        document.getElementById('role_m').value = (u.role && u.role.toLowerCase() === 'admin') ? 'admin' : 'client';
                    }
                }catch(e){ /* ignore */ }
            }
            modal.style.display = 'flex';
        }

        function closeAccountModal(){ modal.style.display = 'none'; editingEmail = null; }
        closeBtn.addEventListener('click', closeAccountModal);
        cancelBtn.addEventListener('click', closeAccountModal);
        if(createBtn) createBtn.addEventListener('click', function(){ openAccountModal('create'); });

    form.addEventListener('submit', async function(e){
            e.preventDefault();
            var firstName = (document.getElementById('firstName_m').value||'').trim();
            var lastName = (document.getElementById('lastName_m').value||'').trim();
            var email = (document.getElementById('email_m').value||'').trim().toLowerCase();
            var phone = (document.getElementById('phone_m').value||'').trim();
            var password = (document.getElementById('password_m').value||'');
            var role = (document.getElementById('role_m').value||'client');
            if(!email){ alert('Please enter an email'); return; }
            try{
                var users = JSON.parse(localStorage.getItem('users')||'[]') || [];
                var existing = users.find(function(u){ return (u.email||'').toLowerCase() === email; });
                    if(currentMode === 'create'){
                        if(existing){ alert('A user with this email already exists'); return; }
                        // Prefer creating an Auth user first via the server so we get a canonical uid.
                        var fullName = (firstName || '') + (lastName ? (' ' + lastName) : '');
                        var profile = { name: fullName.trim(), displayName: fullName.trim(), phone: phone || '' };
                        try{
                            var resp = null;
                            try{
                                resp = await fetch('http://127.0.0.1:3000/api/admin/create-user', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: email, password: password || 'changeme', profile: profile }) });
                                if(!resp.ok){
                                    console.warn('Direct admin create-user returned non-ok', resp.status);
                                    resp = await fetch('server-proxy.php/api/admin/create-user', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: email, password: password || 'changeme', profile: profile }) });
                                }
                            }catch(fetchErr){
                                console.warn('Direct admin create-user failed, falling back to proxy', fetchErr);
                                try{ resp = await fetch('server-proxy.php/api/admin/create-user', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: email, password: password || 'changeme', profile: profile }) }); }catch(proxyErr){ console.warn('Proxy admin create-user failed', proxyErr); resp = null; }
                            }

                            if(resp && resp.ok){
                                var jr = null;
                                try{ jr = await resp.json(); }catch(parseErr){ console.warn('admin create-user parse failed', parseErr); alert('Created user but could not parse server response. Check server logs.'); return; }
                                var newUser = { email: email, password: password || '', firstName: firstName, lastName: lastName, phone: phone, role: (role === 'admin' ? 'admin' : 'user'), registeredAt: Date.now(), uid: jr.uid };
                                users.push(newUser);
                            } else {
                                // If server creation not available, fall back to local creation and client-side Firestore writes (legacy)
                                var newUser = { email: email, password: password || '', firstName: firstName, lastName: lastName, phone: phone, role: (role === 'admin' ? 'admin' : 'user'), registeredAt: Date.now() };
                                users.push(newUser);
                                alert('Created local user entry; server-side Auth creation unavailable.');
                            }
                        }catch(e){ console.warn('Admin create-user flow failed', e); alert('Failed to create user via server: ' + (e && e.message ? e.message : e)); return; }
                    } else {
                        // When editing, locate the original record by the editingEmail (the original email before edits)
                        var originalEmail = (editingEmail ? decodeURIComponent(editingEmail) : null);
                        var idx = -1;
                        if(originalEmail){ idx = users.findIndex(function(u){ return (u.email||'').toLowerCase() === (originalEmail||'').toLowerCase(); }); }
                        // If we couldn't find by original email, fallback to finding by the submitted email
                        if(idx === -1){ idx = users.findIndex(function(u){ return (u.email||'').toLowerCase() === (email||'').toLowerCase(); }); }
                        if(idx === -1){ alert('User not found'); closeAccountModal(); return; }
                        // Ensure new email is not colliding with a different user
                        var collision = users.find(function(u, i){ return i !== idx && (u.email||'').toLowerCase() === (email||'').toLowerCase(); });
                        if(collision){ alert('Another user already uses that email'); return; }
                        var existingUser = users[idx];
                        existingUser.firstName = firstName || existingUser.firstName;
                        existingUser.lastName = lastName || existingUser.lastName;
                        existingUser.phone = phone || existingUser.phone;
                        if(password) existingUser.password = password;
                        existingUser.role = (role === 'admin') ? 'admin' : (existingUser.role || 'user');
                        // If email changed, update it
                        existingUser.email = email;
                    }
                localStorage.setItem('users', JSON.stringify(users));
                closeAccountModal();
                // refresh table
                try{ render(); }catch(e){}
                // Persist to server-side canonical accounts when we have a uid for this record.
                try{
                    var localUsers2 = JSON.parse(localStorage.getItem('users')||'[]') || [];
                    var createdLocal = localUsers2.find(function(u){ return (u.email||'').toLowerCase() === (email||'').toLowerCase(); });
                    if(createdLocal && createdLocal.uid){
                        // Call server endpoint to merge profile into canonical accounts/{uid}
                        try{
                            var payload = { uid: createdLocal.uid, profile: { name: (createdLocal.firstName||'') + (createdLocal.lastName ? (' ' + createdLocal.lastName) : ''), phone: createdLocal.phone || '' } };
                            try{ var r2 = await fetch('http://127.0.0.1:3000/api/create-account-doc', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) }); if(!r2.ok) r2 = await fetch('server-proxy.php/api/create-account-doc', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) }); }catch(e){ console.warn('Failed to notify server to create-account-doc after admin create', e); }
                        }catch(e){ console.warn('Failed to call server create-account-doc', e); }
                    } else {
                        // No uid known: do NOT create encoded-email alias docs from the admin UI.
                        // This is intentional to keep `accounts/{uid}` canonical. Admin should
                        // retry creation when the server endpoint is available.
                        console.warn('No uid available for created account; skipping client-side encoded-email write to Firestore.');
                    }
                }catch(e){ console.warn('Post-create persistence handling failed', e); }
            }catch(err){ console.warn('Could not save user', err); alert('Could not save user'); }
        });

        // delegate clicks for edit/delete in the table
        document.getElementById('accountsTbody').addEventListener('click', function(e){
            var editBtn = e.target.closest && e.target.closest('.edit-btn');
            if(editBtn){ var em = editBtn.getAttribute('data-email') || ''; openAccountModal('edit', em); return; }
            var delBtn = e.target.closest && e.target.closest('.delete-btn');
                if(delBtn){
                var em2 = decodeURIComponent(delBtn.getAttribute('data-email')||'');
                if(confirm('Delete account ' + em2 + '? This cannot be undone.')){
                    try{
                        // Attempt server-side deletion first (preferred). Use admin-authenticated endpoint.
                        (async function(){
                            var users = JSON.parse(localStorage.getItem('users')||'[]')||[];
                            var target = users.find(function(u){ return (u.email||'').toLowerCase() === (em2||'').toLowerCase(); });
                            var uid = (target && target.uid) ? String(target.uid) : null;
                            var email = em2 || null;
                            var triedServer = false;
                            var serverResp = null;
                            try{
                                if(window.firebase && firebase.auth && firebase.auth().currentUser){
                                    try{
                                        var idToken = await firebase.auth().currentUser.getIdToken(true);
                                        var resp = await fetch('http://127.0.0.1:3000/api/admin/delete-user', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + idToken }, body: JSON.stringify({ uid: uid, email: email }) });
                                        if(!resp.ok){
                                            // try proxy fallback
                                            try{ resp = await fetch('server-proxy.php/api/admin/delete-user', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + idToken }, body: JSON.stringify({ uid: uid, email: email }) }); }catch(e){}
                                        }
                                        serverResp = resp || null;
                                        triedServer = true;
                                    }catch(e){ console.warn('Server delete attempt failed (direct)', e); }
                                }
                            }catch(e){ console.warn('Server delete flow failed', e); }

                            // If we attempted server deletion, require a successful server response
                            if(triedServer){
                                try{
                                    if(!serverResp || !serverResp.ok){
                                        // try to show server error message
                                        try{
                                            var body = await (serverResp && serverResp.json ? serverResp.json() : Promise.resolve(null));
                                            var msg = (body && body.error) ? (body.error + (body.detail ? (': ' + body.detail) : '')) : ('Server returned ' + (serverResp && serverResp.status));
                                            alert('Server refused to delete the user: ' + msg + '\n\nEnsure you are signed in as an administrator with proper privileges and that your ID token is fresh.');
                                        }catch(e){ alert('Server refused to delete the user. Ensure you are signed in as an administrator.'); }
                                        return;
                                    }
                                }catch(e){ console.warn('Post-server-response handling failed', e); alert('Server deletion failed. Aborting local cleanup.'); return; }
                            } else {
                                // Server not reachable / not attempted: ask the admin if they want a local-only delete
                                var proceedLocal = confirm('Server delete could not be attempted (server unreachable). Do you want to remove this user locally only?\n\nNote: This will NOT remove the user from the server.');
                                if(!proceedLocal) return;
                            }

                            // Proceed with local cleanup and UI update
                            try{
                                var users2 = JSON.parse(localStorage.getItem('users')||'[]')||[];
                                users2 = users2.filter(function(u){ return (u.email||'').toLowerCase() !== (em2||'').toLowerCase(); });
                                localStorage.setItem('users', JSON.stringify(users2));
                                // Remove related localStorage entries for this email so old data doesn't reappear
                                try{ if(typeof removeLocalDataForEmail === 'function') removeLocalDataForEmail(em2); else console.warn('removeLocalDataForEmail not available'); }catch(e){ console.warn('removeLocalDataForEmail failed', e); }
                                try{ if(typeof window.renderAccountsTable === 'function'){ window.renderAccountsTable(); } else if(typeof render === 'function'){ render(); } }catch(e){}
                            }catch(e){ console.warn('Local cleanup failed', e); }

                            // Best-effort: also attempt client-side Firestore deletes (in case server wasn't reachable)
                            try{
                                if(window.firebase && firebase.firestore){
                                    try{
                                        var db = firebase.firestore();
                                        var docId = (uid) ? uid : encodeURIComponent(em2);
                                        db.collection('accounts').doc(docId).delete().catch(function(){});
                                        // attempt to delete orders referencing this email (best-effort, may require server privileges)
                                        try{ db.collection('orders').where('customerEmail','==',em2).get().then(s=>{ s.forEach(d=>d.ref.delete().catch(()=>{})); }).catch(()=>{}); }catch(e){}
                                        try{ if(uid) db.collection('orders').where('user_id','==',uid).get().then(s=>{ s.forEach(d=>d.ref.delete().catch(()=>{})); }).catch(()=>{}); }catch(e){}
                                    }catch(e){ console.warn('Failed to perform client-side Firestore cleanup', e); }
                                }
                            }catch(e){}

                        })();
                    }catch(err){ console.warn('Delete failed', err); alert('Delete failed'); }
                }
            }
        });
    })();
    </script>
