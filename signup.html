<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up - SHOEPAO</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: 'Montserrat', Arial, sans-serif;
            background: #fff;
            margin: 0;
            padding: 0;
        }
        .signup-wrapper {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            justify-content: center;
            min-height: 100vh;
            width: 100vw;
            position: relative;
            background: #fff;
            z-index: 1;
            gap: 2.5vw; /* bring logo closer to the form */
        }
        .logo-section {
            display: flex;
            align-items: center;
            justify-content: center; /* center logo within its column */
            min-width: 110px;
            max-width: 220px; /* tighter max width so logo is nearer the form */
            margin-top: 18px; /* reduced top offset */
            padding-left: 6px;
            padding-right: 6px;
        }
        .logo-section img {
            width: 120px;
            height: auto;
        }
        .form-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 320px;
            max-width: 480px;
            margin-left: auto;
            margin-right: auto;
            margin-top: 116px; /* Reduce gap by 30% from previous 166px */
            padding-bottom: 180px; /* provide space at bottom so signup action row isn't flush to viewport bottom */
        }
        .signup-header {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 32px;
            color: #222;
        }
        .name-row {
            display: flex;
            gap: 16px;
            width: 100%;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            flex: 1;
        }
        .input-label {
            font-size: 0.98rem;
            color: #444;
            margin-bottom: 6px;
            font-weight: 500;
        }
        .input-box {
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            margin-bottom: 18px;
            background: #fff;
            outline: none;
            transition: border 0.2s;
        }
        .input-box:focus {
            border-color: #b71c1c;
        }
        .phone-row {
            position: relative;
            width: 100%;
        }
        .phone-prefix {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #444;
            font-size: 1rem;
            pointer-events: none;
            /* no extra spacing between prefix and input */
            margin-right: 0;
            letter-spacing: 0.5px;
        }
        /* decorative marker removed - no extra marker */
        .phone-input {
            border: none;
            outline: none;
            font-size: 1rem;
            background: transparent;
            flex: 1;
            letter-spacing: 2px;
            padding-left: 100px; /* reduced by 20px so gap is 20px smaller */
            height: 100%;
            text-align: left;
            z-index: 1;
            position: relative;
            top: 0;
            display: flex;
            align-items: center;
            padding-top: 0 !important;
            padding-bottom: 0 !important;
            margin-top: auto;
            margin-bottom: auto;
            box-sizing: border-box;
        }
        .password-row {
            width: 100%;
        }
        .password-label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .toggle-password {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            color: #888;
            font-size: 1rem;
            user-select: none;
        }
        .eye-icon {
            font-size: 1.1em;
        }
        .password-instruction {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 18px;
            margin-top: -10px;
        }
        .checkbox-row {
            display: flex;
            align-items: flex-start;
            margin-bottom: 10px;
        }
        .checkbox-row input[type="checkbox"] {
            margin-right: 8px;
            margin-top: 2px;
        }
        .checkbox-row label {
            font-size: 0.97rem;
            color: #222;
        }
        .checkbox-row a {
            text-decoration: underline;
            color: #222;
        }
        .signup-action-row {
            display: flex;
            align-items: center;
            margin-top: 28px;
            width: 100%;
        }
        .signup-btn {
            background: #000;
            color: #fff;
            border: none;
            border-radius: 24px;
            padding: 12px 36px;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            margin-right: 24px;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .signup-btn:hover {
            background: #b71c1c;
        }
        .login-link-row {
            font-size: 1rem;
            color: #222;
        }
        .login-link-row a {
            text-decoration: underline;
            color: #222;
            cursor: pointer;
        }
        @media (max-width: 900px) {
            .signup-wrapper {
                flex-direction: column;
                align-items: center;
            }
            .logo-section {
                padding-left: 0;
                justify-content: center;
            }
            .form-section {
                margin-left: 0;
                max-width: 100%;
            }
        }
        @media (min-width: 900px) {
            .signup-wrapper {
                /* Keep centered horizontally but flow naturally from the top so
                   the logo and header remain visible at normal zoom. Avoid
                   absolute centering which can cause clipping on some screens. */
                position: relative;
                margin: 48px auto; /* provide top space so header/logo are visible */
                transform: none;
                left: auto;
                top: auto;
                width: auto;
                min-width: 0;
                max-width: calc(100% - 64px);
            }
        }
    /* Social button styles — mirror login page */
    .social-auth { display:flex; gap:10px; margin:12px 0; justify-content:center; }
    .social-btn { display:flex; align-items:center; gap:12px; padding:12px 18px; border-radius:8px; cursor:pointer; font-weight:600; font-size:1rem; border:0; width:100%; max-width:420px; box-sizing:border-box; justify-content:center; }
    .social-btn img { width:24px; height:24px; object-fit:contain; }

    /* Simple modal/overlay used for verification and social confirmations */
    .verification-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.45);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        padding: 24px;
    }
    .verification-modal {
        background: #fff;
        border-radius: 12px;
        max-width: 520px;
        width: 100%;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        padding: 20px 22px;
        color: #222;
    }
    .verification-modal h3 { margin-top:0; margin-bottom:8px; font-size:1.25rem; }
    .verification-modal p { margin:0; color:#444; line-height:1.4; }
    /* Small button helpers (kept minimal so other pages can reuse) */
    .btn { padding:8px 12px; border-radius:8px; border:1px solid transparent; cursor:pointer; font-weight:600; }
    .btn-primary { background:#000; color:#fff; border-color:#000; }
    .btn-outline { background:transparent; color:#222; border-color:#ccc; }
    /* PSGC address selector (signup) */
    .address-grid { display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap:12px; }
    .address-field { display:flex; flex-direction:column; gap:6px; }
    .address-field-full { grid-column: 1 / -1; }
    .address-label { font-size:0.92rem; color:#444; }
    .address-field input, .address-field select { padding:12px 14px; border:1px solid #ddd; border-radius:8px; font-size:1rem; font-family:inherit; background:#fff; }
    .address-field select:disabled { background:#f0f0f0; color:#888; }
    .address-hint { font-size:0.9rem; color:#666; margin:8px 0 18px 0; }
    @media (max-width: 700px) { .address-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="signup-wrapper">
        <div class="logo-section">
            <img src="IMAGE/SHOEPAOLOGO.png" alt="SHOEPAO Logo">
        </div>
        <form class="form-section" autocomplete="off" onsubmit="return handleSignup(event)">
            <div class="signup-header">Sign up now</div>
            <div class="social-auth">
                <button id="googleSignIn" class="social-btn google" type="button" aria-label="Sign up with Google">
                    <img src="IMAGE/googleicon.png" alt="Google logo" />
                    <span>Sign up with Google</span>
                </button>
            </div>
            <div class="name-row">
                <div class="input-group">
                    <label for="firstName" class="input-label">First name</label>
                    <input type="text" id="firstName" name="firstName" class="input-box" required>
                </div>
                <div class="input-group">
                    <label for="lastName" class="input-label">Last name</label>
                    <input type="text" id="lastName" name="lastName" class="input-box" required>
                </div>
            </div>
            <div class="input-group">
                <label for="email" class="input-label">Email address</label>
                <input type="email" id="email" name="email" class="input-box" required>
            </div>
            <div class="input-group">
                <label for="phone" class="input-label">Phone number</label>
                <div class="phone-row">
                    <span class="phone-prefix">+63</span>
                    <input type="text" id="phone" name="phone" class="phone-input" maxlength="12" inputmode="numeric" placeholder="Phone number" required oninput="formatPhone(this)">
                </div>
            </div>
            <div class="input-group">
                <label class="input-label">Address</label>
                <div class="address-grid">
                    <div class="address-field">
                        <span class="address-label">Region</span>
                        <select id="signupRegionSelect" aria-label="Region" required>
                            <option value="">Select region</option>
                        </select>
                    </div>
                    <div class="address-field">
                        <span class="address-label">Province</span>
                        <select id="signupProvinceSelect" aria-label="Province" disabled>
                            <option value="">Select province</option>
                        </select>
                    </div>
                    <div class="address-field">
                        <span class="address-label">City / Municipality</span>
                        <select id="signupCitySelect" aria-label="City or municipality" disabled required>
                            <option value="">Select city/municipality</option>
                        </select>
                    </div>
                    <div class="address-field">
                        <span class="address-label">Barangay</span>
                        <select id="signupBarangaySelect" aria-label="Barangay" disabled required>
                            <option value="">Select barangay</option>
                        </select>
                    </div>
                    <div class="address-field address-field-full">
                        <span class="address-label">Street / House No.</span>
                        <input type="text" id="signupStreet" placeholder="e.g. 123 Green St." required>
                    </div>
                    <div class="address-field">
                        <span class="address-label">Postal code</span>
                        <input type="text" id="signupPostal" placeholder="e.g. 1100" maxlength="4" inputmode="numeric" pattern="\d{4}" oninput="this.value=this.value.replace(/\D/g,'').slice(0,4)" />
                    </div>
                </div>
                <div id="signupRegionHint" class="address-hint">Select region to load PSGC provinces and cities.</div>
            </div>
            <div class="password-row">
                <div class="password-label-row">
                    <label for="password" class="input-label">Password</label>
                    <span class="toggle-password" onclick="togglePassword()" id="toggleIcon"><span class="eye-icon">&#128065;</span> Hide</span>
                </div>
                <input type="password" id="password" name="password" class="input-box" placeholder="Password">
            </div>
            <div class="password-instruction">Use 8 or more characters with a mix of letters, numbers & symbols</div>
            <!-- Terms/consent checkboxes removed as requested -->
            <div class="signup-action-row">
                <button type="submit" class="signup-btn">Sign up</button>
                <div class="login-link-row">Already have an account? <a href="login.html">Log in</a></div>
            </div>
        </form>
    </div>
    <!-- Shared Firebase config and SDKs -->
    <script src="js/firebase-config.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <script>
        // Lightweight, robust client-side handlers for signup page
        (function(){
            // Toggle password visibility
            window.togglePassword = function(){
                const passwordInput = document.getElementById('password');
                const toggleIcon = document.getElementById('toggleIcon');
                if (!passwordInput) return;
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    if (toggleIcon) toggleIcon.innerHTML = '<span class="eye-icon">&#128065;</span> Show';
                } else {
                    passwordInput.type = 'password';
                    if (toggleIcon) toggleIcon.innerHTML = '<span class="eye-icon">&#128065;</span> Hide';
                }
            };

            // Format phone input as xxx xxx xxxx while preserving caret as best-effort
            window.formatPhone = function(input){
                if(!input) return;
                const old = input.value;
                const selStart = input.selectionStart || 0;
                // Count digits before caret in old value
                let digitsBefore = 0;
                for (let i = 0; i < selStart; i++) if (/\d/.test(old[i])) digitsBefore++;
                // Build numeric-only limited to 10 digits
                const digits = (old.match(/\d/g) || []).slice(0,10).join('');
                let parts = [];
                if (digits.length > 0) parts.push(digits.substring(0, Math.min(3, digits.length)));
                if (digits.length > 3) parts.push(digits.substring(3, Math.min(6, digits.length)));
                if (digits.length > 6) parts.push(digits.substring(6, 10));
                const formatted = parts.join(' ');
                input.value = formatted;
                // Map digit index back to new caret position
                let newPos = 0; let d = 0;
                while (d < digitsBefore && newPos < formatted.length) {
                    if (/\d/.test(formatted[newPos])) d++;
                    newPos++;
                }
                try{ input.setSelectionRange(newPos, newPos); }catch(e){}
            };

            // PSGC address selector (signup)
            const PSGC_BASE = 'https://psgc.cloud/api';
            function fetchPSGC(url){
                return new Promise(function(resolve, reject){
                    try{
                        const cacheKey = 'psgc_cache_' + url;
                        const cached = localStorage.getItem(cacheKey);
                        if(cached){
                            try{ const parsed = JSON.parse(cached); if(parsed && parsed.data && parsed.ts && (Date.now() - parsed.ts) < (7*24*60*60*1000)) return resolve(parsed.data); }catch(e){}
                        }
                        fetch(url, { headers: { 'Accept': 'application/json' } })
                            .then(function(res){ return res.json(); })
                            .then(function(data){
                                try{ localStorage.setItem(cacheKey, JSON.stringify({ ts: Date.now(), data: data })); }catch(e){}
                                resolve(data);
                            })
                            .catch(function(err){ reject(err); });
                    }catch(e){ reject(e); }
                });
            }
            function toOptionItem(item){ return { code: item.code || item.psgc || item.id || '', name: item.name || item.regionName || item.provinceName || item.cityName || item.municipalityName || '' }; }
            function fillSelect(select, items, placeholder){
                if(!select) return;
                select.innerHTML = '';
                const opt = document.createElement('option');
                opt.value = ''; opt.textContent = placeholder || 'Select';
                select.appendChild(opt);
                (items || []).forEach(function(it){
                    const o = document.createElement('option');
                    o.value = it.code; o.textContent = it.name; o.dataset.name = it.name; select.appendChild(o);
                });
            }
            function setSelectDisabled(select, disabled){ if(!select) return; select.disabled = !!disabled; if(disabled) select.value = ''; }

            function initSignupAddressSelector(){
                const regionSel = document.getElementById('signupRegionSelect');
                const provinceSel = document.getElementById('signupProvinceSelect');
                const citySel = document.getElementById('signupCitySelect');
                const brgySel = document.getElementById('signupBarangaySelect');
                const hint = document.getElementById('signupRegionHint');

                function resetChildren(){
                    fillSelect(provinceSel, [], 'Select province');
                    fillSelect(citySel, [], 'Select city/municipality');
                    fillSelect(brgySel, [], 'Select barangay');
                    setSelectDisabled(provinceSel, true);
                    setSelectDisabled(citySel, true);
                    setSelectDisabled(brgySel, true);
                }

                function loadProvincesOrCities(regionCode){
                    resetChildren();
                    if(!regionCode) return;
                    if(hint) hint.textContent = 'Loading provinces...';
                    fetchPSGC(PSGC_BASE + '/regions/' + encodeURIComponent(regionCode) + '/provinces')
                        .then(function(list){
                            const provinces = (list || []).map(toOptionItem).sort(function(a,b){ return a.name.localeCompare(b.name); });
                            if(provinces.length){
                                fillSelect(provinceSel, provinces, 'Select province');
                                setSelectDisabled(provinceSel, false);
                                if(hint) hint.textContent = 'Select province to load cities.';
                            } else {
                                setSelectDisabled(provinceSel, true);
                                if(hint) hint.textContent = 'Loading cities...';
                                loadCitiesByRegion(regionCode);
                            }
                        })
                        .catch(function(){ if(hint) hint.textContent = 'Unable to load PSGC provinces.'; });
                }

                function loadCitiesByProvince(provinceCode){
                    fillSelect(citySel, [], 'Select city/municipality');
                    fillSelect(brgySel, [], 'Select barangay');
                    setSelectDisabled(citySel, true);
                    setSelectDisabled(brgySel, true);
                    if(!provinceCode) return;
                    if(hint) hint.textContent = 'Loading cities...';
                    fetchPSGC(PSGC_BASE + '/provinces/' + encodeURIComponent(provinceCode) + '/cities-municipalities')
                        .then(function(list){
                            const cities = (list || []).map(toOptionItem).sort(function(a,b){ return a.name.localeCompare(b.name); });
                            fillSelect(citySel, cities, 'Select city/municipality');
                            setSelectDisabled(citySel, false);
                            if(hint) hint.textContent = 'Select city to load barangays.';
                        })
                        .catch(function(){ if(hint) hint.textContent = 'Unable to load PSGC cities.'; });
                }

                function loadCitiesByRegion(regionCode){
                    fillSelect(citySel, [], 'Select city/municipality');
                    fillSelect(brgySel, [], 'Select barangay');
                    setSelectDisabled(citySel, true);
                    setSelectDisabled(brgySel, true);
                    if(!regionCode) return;
                    fetchPSGC(PSGC_BASE + '/regions/' + encodeURIComponent(regionCode) + '/cities-municipalities')
                        .then(function(list){
                            const cities = (list || []).map(toOptionItem).sort(function(a,b){ return a.name.localeCompare(b.name); });
                            fillSelect(citySel, cities, 'Select city/municipality');
                            setSelectDisabled(citySel, false);
                            if(hint) hint.textContent = 'Select city to load barangays.';
                        })
                        .catch(function(){ if(hint) hint.textContent = 'Unable to load PSGC cities.'; });
                }

                function loadBarangays(cityCode){
                    fillSelect(brgySel, [], 'Select barangay');
                    setSelectDisabled(brgySel, true);
                    if(!cityCode) return;
                    if(hint) hint.textContent = 'Loading barangays...';
                    fetchPSGC(PSGC_BASE + '/cities-municipalities/' + encodeURIComponent(cityCode) + '/barangays')
                        .then(function(list){
                            const brgys = (list || []).map(toOptionItem).sort(function(a,b){ return a.name.localeCompare(b.name); });
                            fillSelect(brgySel, brgys, 'Select barangay');
                            setSelectDisabled(brgySel, false);
                            if(hint) hint.textContent = 'Barangay loaded.';
                        })
                        .catch(function(){ if(hint) hint.textContent = 'Unable to load PSGC barangays.'; });
                }

                fetchPSGC(PSGC_BASE + '/regions')
                    .then(function(list){
                        const regions = (list || []).map(toOptionItem).sort(function(a,b){ return a.name.localeCompare(b.name); });
                        fillSelect(regionSel, regions, 'Select region');
                        setSelectDisabled(regionSel, false);
                    })
                    .catch(function(){ if(hint) hint.textContent = 'Unable to load PSGC regions.'; });

                regionSel && regionSel.addEventListener('change', function(){
                    const code = (this.value || '').trim();
                    resetChildren();
                    loadProvincesOrCities(code);
                });
                provinceSel && provinceSel.addEventListener('change', function(){
                    const code = (this.value || '').trim();
                    fillSelect(citySel, [], 'Select city/municipality');
                    fillSelect(brgySel, [], 'Select barangay');
                    setSelectDisabled(citySel, true);
                    setSelectDisabled(brgySel, true);
                    loadCitiesByProvince(code);
                });
                citySel && citySel.addEventListener('change', function(){
                    const code = (this.value || '').trim();
                    fillSelect(brgySel, [], 'Select barangay');
                    setSelectDisabled(brgySel, true);
                    loadBarangays(code);
                });
            }

            function generateAddressId(){ return 'addr_' + Date.now() + '_' + Math.floor(Math.random() * 1000000); }
            function normalizeAddressEntry(entry){
                if(!entry) return entry;
                const line2Parts = [];
                const brgyName = entry.barangay && entry.barangay.name ? entry.barangay.name : entry.barangay;
                const cityName = entry.city && entry.city.name ? entry.city.name : entry.city;
                const provName = entry.province && entry.province.name ? entry.province.name : entry.province;
                const regName = entry.region && entry.region.name ? entry.region.name : entry.region;
                if(brgyName) line2Parts.push(brgyName);
                if(cityName) line2Parts.push(cityName);
                if(provName) line2Parts.push(provName);
                if(regName) line2Parts.push(regName);
                if(entry.postalCode) line2Parts.push(entry.postalCode);
                entry.line1 = entry.line1 || ((entry.fullName ? entry.fullName + ', ' : '') + (entry.street || ''));
                entry.line2 = entry.line2 || line2Parts.join(', ');
                return entry;
            }
            function getSignupAddressObject(){
                const regionSel = document.getElementById('signupRegionSelect');
                const provinceSel = document.getElementById('signupProvinceSelect');
                const citySel = document.getElementById('signupCitySelect');
                const brgySel = document.getElementById('signupBarangaySelect');
                const region = regionSel && regionSel.value ? { code: regionSel.value, name: regionSel.options[regionSel.selectedIndex].textContent } : null;
                const province = provinceSel && provinceSel.value ? { code: provinceSel.value, name: provinceSel.options[provinceSel.selectedIndex].textContent } : null;
                const city = citySel && citySel.value ? { code: citySel.value, name: citySel.options[citySel.selectedIndex].textContent } : null;
                const barangay = brgySel && brgySel.value ? { code: brgySel.value, name: brgySel.options[brgySel.selectedIndex].textContent } : null;
                const street = (document.getElementById('signupStreet') && document.getElementById('signupStreet').value || '').trim();
                const postalCode = (document.getElementById('signupPostal') && document.getElementById('signupPostal').value || '').trim();
                return { region, province, city, barangay, street, postalCode };
            }

            // Show a simple modal informing user that a verification email was sent
            function showPendingEmailSentOverlay(email){
                try{
                    const overlay = document.createElement('div'); overlay.className = 'verification-overlay';
                    const modal = document.createElement('div'); modal.className = 'verification-modal';
                    modal.innerHTML = '<h3>E-mail Verification Sent</h3>' +
                        '<p>A verification email was sent to <strong>' + (email||'') + '</strong>. Please follow the link in that email to verify your account, then sign in.</p>' +
                        '<p style="color:#666;font-size:0.95rem;margin-top:8px">If you don\'t see the message, please check your Spam or Junk folder.</p>' +
                        '<div style="text-align:right;margin-top:12px"><button id="resendVerification" class="btn btn-outline">Resend</button><button id="closePending" class="btn btn-primary" style="margin-left:8px">Close</button></div>';
                    overlay.appendChild(modal); document.body.appendChild(overlay);

                    // Resend handler: prefer client-side Firebase SDK so verification works without SMTP/server
                    document.getElementById('resendVerification').addEventListener('click', async function(){
                        const btn = this; btn.disabled = true; btn.textContent = 'Sending...';
                        try{
                            // Primary: client SDK
                            try{
                                if (window.firebase && firebase.auth && firebase.auth().currentUser && firebase.auth().currentUser.sendEmailVerification) {
                                    await firebase.auth().currentUser.sendEmailVerification({ url: window.location.origin + '/login.html' });
                                    btn.textContent = 'Sent';
                                    setTimeout(function(){ if(btn) { btn.textContent = 'Resend'; btn.disabled = false; } }, 3000);
                                    return;
                                }
                            }catch(err){ console.warn('client resend failed', err); }

                            // Secondary: try server-side send if client SDK unavailable or failed
                            try{
                                const r = await fetch('/server-proxy.php/api/send-verification-email', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: (firebase && firebase.auth && firebase.auth().currentUser && firebase.auth().currentUser.email) || '', displayName: '', returnUrl: window.location.origin }) });
                                if (r && r.ok) {
                                    btn.textContent = 'Sent';
                                    setTimeout(function(){ if(btn) { btn.textContent = 'Resend'; btn.disabled = false; } }, 3000);
                                    return;
                                } else {
                                    console.warn('server resend returned non-ok', r && r.status);
                                }
                            }catch(e){ console.warn('server resend failed', e); }

                            // If we reach here, both attempts failed
                            btn.textContent = 'Unable to send';
                            setTimeout(function(){ if(btn) { btn.textContent = 'Resend'; btn.disabled = false; } }, 3000);
                        }catch(err){ console.warn('Resend failed', err); btn.textContent = 'Error'; setTimeout(function(){ if(btn){ btn.textContent = 'Resend'; btn.disabled = false; } }, 3000); }
                    });

                    // Poll for email verification if the user is still signed in on this tab
                    var verificationPoll = null;
                    function stopVerificationPoll(){ try{ if(verificationPoll) { clearInterval(verificationPoll); verificationPoll = null; } }catch(e){} }
                    try{
                        if (window.firebase && firebase.auth && firebase.auth().currentUser) {
                            // show a subtle status below the buttons
                            var status = document.createElement('div'); status.style.marginTop = '10px'; status.style.color = '#444'; status.id = 'verificationStatus'; status.textContent = 'Waiting for email verification...';
                            modal.appendChild(status);
                            verificationPoll = setInterval(function(){
                                try{
                                    var u = firebase.auth().currentUser;
                                    if (!u || !u.reload) return;
                                    u.reload().then(function(){
                                        try{
                                            if (u.emailVerified) {
                                                stopVerificationPoll();
                                                // Sign out and redirect to login so the user can sign in
                                                try{ firebase.auth().signOut().catch(()=>{}); }catch(e){}
                                                window.location.href = 'login.html?verifiedFromSignup=1';
                                            }
                                        }catch(e){ console.warn('verification poll check failed', e); }
                                    }).catch(function(err){ /* ignore reload errors */ });
                                }catch(e){ /* ignore */ }
                            }, 3000);
                        }
                    }catch(e){}

                    document.getElementById('closePending').addEventListener('click', function(){
                        try{ stopVerificationPoll(); }catch(e){}
                        try{ if (window.firebase && firebase.auth && firebase.auth().currentUser) { firebase.auth().signOut().catch(()=>{}); } }catch(e){}
                        if (overlay && overlay.parentNode) overlay.parentNode.removeChild(overlay);
                        window.location.href='login.html';
                    });
                }catch(e){ alert('A verification email was sent. Please check your inbox.'); try{ if (window.firebase && firebase.auth && firebase.auth().signOut) firebase.auth().signOut().catch(()=>{}); }catch(_){}; window.location.href='login.html'; }
            }

            // Show a confirmation modal before starting social sign-in
            window.showSocialConfirmModal = function(providerName, providerLabel){
                try{
                    const overlay = document.createElement('div'); overlay.className = 'verification-overlay';
                    const modal = document.createElement('div'); modal.className = 'verification-modal';
                    modal.innerHTML = '<h3>Continue with ' + (providerLabel||providerName) + '?</h3>' +
                        '<p>We will use your ' + (providerLabel||providerName) + ' account to create or sign in to your ShoePao account.</p>' +
                        '<div style="text-align:right;margin-top:12px"><button id="socialCancel" class="btn btn-outline">Cancel</button><button id="socialConfirm" class="btn btn-primary" style="margin-left:8px">Continue</button></div>';
                    overlay.appendChild(modal); document.body.appendChild(overlay);
                    document.getElementById('socialCancel').addEventListener('click', function(){ if(overlay && overlay.parentNode) overlay.parentNode.removeChild(overlay); });
                    document.getElementById('socialConfirm').addEventListener('click', function(){ try{ if(overlay && overlay.parentNode) overlay.parentNode.removeChild(overlay); }catch(e){}; signInWithProvider(providerName); });
                }catch(e){ console.warn('social confirm modal failed', e); signInWithProvider(providerName); }
            };

            // Lightweight status overlay used by signup flow
            function showSignupStatus(msg, options){
                try{
                    options = options || {};
                    var existing = document.getElementById('signupStatusOverlay');
                    if(!existing){
                        var ov = document.createElement('div'); ov.id = 'signupStatusOverlay'; ov.className = 'verification-overlay';
                        var md = document.createElement('div'); md.className = 'verification-modal'; md.style.maxWidth = '520px'; md.style.textAlign = 'center';
                        var p = document.createElement('div'); p.id = 'signupStatusText'; p.style.marginBottom = '12px'; p.style.color = '#222'; p.textContent = msg || '';
                        md.appendChild(p);
                        if(options.showButtons){
                            var btnRow = document.createElement('div'); btnRow.style.textAlign = 'right'; btnRow.style.marginTop = '12px';
                            var cancel = document.createElement('button'); cancel.className = 'btn btn-outline'; cancel.textContent = 'Close';
                            cancel.addEventListener('click', function(){ try{ if(ov && ov.parentNode) ov.parentNode.removeChild(ov); }catch(e){} });
                            btnRow.appendChild(cancel);
                            md.appendChild(btnRow);
                        }
                        ov.appendChild(md); document.body.appendChild(ov);
                        existing = ov;
                    } else {
                        var p = document.getElementById('signupStatusText'); if(p) p.textContent = msg || '';
                    }
                    if(options.hide && existing && existing.parentNode) existing.parentNode.removeChild(existing);
                }catch(e){ console.warn('showSignupStatus failed', e); }
            }

            // Signup handler: create user, save metadata (non-sensitive), send verification, sign out
            window.handleSignup = async function(e){
                e && e.preventDefault && e.preventDefault();
                const firstName = (document.getElementById('firstName').value||'').trim();
                const lastName = (document.getElementById('lastName').value||'').trim();
                const email = (document.getElementById('email').value||'').trim().toLowerCase();
                const phone = (document.getElementById('phone').value||'').trim();
                const password = (document.getElementById('password').value||'');
                const addressObj = getSignupAddressObject();
                const street = addressObj && addressObj.street ? addressObj.street : '';
                const regionName = addressObj && addressObj.region && addressObj.region.name ? addressObj.region.name : '';
                const cityName = addressObj && addressObj.city && addressObj.city.name ? addressObj.city.name : '';
                const barangayName = addressObj && addressObj.barangay && addressObj.barangay.name ? addressObj.barangay.name : '';
                if(!street || !regionName || !cityName || !barangayName){
                    alert('Please complete your address (region, city, barangay, and street).');
                    return false;
                }
                const addressDetails = [barangayName, cityName, (addressObj && addressObj.province && addressObj.province.name) ? addressObj.province.name : '', regionName, addressObj.postalCode || ''].filter(Boolean).join(', ');
                const addressMain = street;
                const fullName = ((firstName||'') + (lastName ? (' ' + lastName) : '')).trim();
                const defaultAddressId = generateAddressId();
                const entry = normalizeAddressEntry({
                    id: defaultAddressId,
                    fullName: fullName,
                    phone: phone || '',
                    street: addressMain,
                    postalCode: addressObj.postalCode || '',
                    notes: '',
                    region: addressObj.region || '',
                    province: addressObj.province || '',
                    city: addressObj.city || '',
                    barangay: addressObj.barangay || '',
                    isDefault: true
                });

                if (!email) { alert('Please enter an email address'); return false; }
                if (!password || password.length < 6) { alert('Please choose a password (6+ characters).'); return false; }

                // Prevent duplicate signups: check whether this email already has sign-in methods
                try{
                    if (window.firebase && firebase.auth && firebase.auth().fetchSignInMethodsForEmail) {
                        const methods = await firebase.auth().fetchSignInMethodsForEmail(email);
                        if (methods && methods.length > 0) {
                            alert('An account with this email already exists. Please sign in or reset your password.');
                            return false;
                        }
                    }
                }catch(e){ /* continue if check fails */ }

                if (!navigator.onLine) { alert('You appear to be offline. Please check your network connection and try again.'); return false; }
                if (!(window.FIREBASE_CONFIG && window.firebase && window.firebase.auth)) { alert('Firebase is not configured. Signup unavailable.'); return false; }
                try{
                    if(!firebase.apps || !firebase.apps.length) firebase.initializeApp(window.FIREBASE_CONFIG);
                    // If the client has an anonymous user active, link the new email credential
                    // to that anonymous user to convert it into a permanent account instead
                    // of creating a separate user. This prevents orphan anonymous accounts.
                    const auth = firebase.auth();
                    let created = null;

                    // Helper to attempt a creation/link operation once
                    async function attemptCreateOnce(){
                        if (auth.currentUser && auth.currentUser.isAnonymous) {
                            // link to anonymous
                            const cred = firebase.auth.EmailAuthProvider.credential(email, password);
                            return await auth.currentUser.linkWithCredential(cred);
                        } else {
                            return await firebase.auth().createUserWithEmailAndPassword(email, password);
                        }
                    }

                    // Retry on network errors with exponential backoff
                    const MAX_ATTEMPTS = 4;
                    let attempt = 0;
                    let backoff = 700; // ms
                    showSignupStatus('Creating account — please wait...');
                    while (attempt < MAX_ATTEMPTS) {
                        try{
                            created = await attemptCreateOnce();
                            break; // success
                        }catch(err){
                            // If it's a network/auth transport error, retry; otherwise surface immediately
                            const code = err && err.code ? err.code : null;
                            const isNetwork = code === 'auth/network-request-failed' || code === 'auth/web-storage-unsupported' || (err && String(err).toLowerCase().indexOf('network') !== -1);
                            attempt++;
                            if (isNetwork && attempt < MAX_ATTEMPTS) {
                                showSignupStatus('Network error while creating account — retrying (' + attempt + '/' + MAX_ATTEMPTS + ')...');
                                await new Promise(r => setTimeout(r, backoff));
                                backoff = Math.min(8000, Math.floor(backoff * 1.8));
                                continue;
                            }
                            // non-retryable or out of attempts
                            showSignupStatus('Unable to create account: ' + (err && err.message ? err.message : String(err)), { showButtons: true });
                            throw err;
                        }
                    }
                    const u = created && created.user ? created.user : null;
                    if (u && (firstName || lastName)) {
                        try{ await u.updateProfile({ displayName: fullName }); }catch(e){}
                    }
                    // Save non-sensitive metadata locally keyed by email
                    try{ var pending = JSON.parse(localStorage.getItem('pendingSignup') || '{}'); }catch(e){ pending = {}; }
                    pending[email] = { firstName, lastName, phone, addressMain, addressDetails, createdAt: Date.now() };
                    try{ localStorage.setItem('pendingSignup', JSON.stringify(pending)); }catch(e){}

                    // Save profile data locally + Firestore for default address
                    let profilePayload = null;
                    try{
                        profilePayload = {
                            email: email,
                            name: fullName,
                            phone: phone || '',
                            addressMain: addressMain || '',
                            addressDetails: addressDetails || '',
                            deliveryAddress: {
                                fullName: fullName,
                                phone: phone || '',
                                street: addressMain || '',
                                postalCode: addressObj.postalCode || '',
                                region: addressObj.region || '',
                                province: addressObj.province || '',
                                city: addressObj.city || '',
                                barangay: addressObj.barangay || ''
                            },
                            addresses: [entry],
                            defaultAddressId: defaultAddressId,
                            uid: u && u.uid ? u.uid : ''
                        };
                        localStorage.setItem('profile', JSON.stringify(profilePayload));
                        localStorage.setItem('profile_updated_at', String(Date.now()));
                        localStorage.setItem('checkoutAddressObject', JSON.stringify(entry));
                        localStorage.setItem('checkoutAddressMain', entry.line1 || entry.street || '');
                        localStorage.setItem('checkoutAddressDetails', entry.line2 || '');
                        try{
                            // Trigger client-side download of a signup txt file so no server proxy is required.
                            // This mirrors how other pages generate downloadable files (Word/CSV) for local audit.
                            if (!window.downloadSignupTxt) {
                                // Helpers to persist directory handle via IndexedDB
                                window._shoepao_fs = window._shoepao_fs || {};
                                window._shoepao_fs.dbName = 'shoepao-fs';
                                window._shoepao_fs.storeName = 'handles';

                                window._shoepao_fs.openDB = function(){
                                    return new Promise(function(resolve, reject){
                                        try{
                                            const req = indexedDB.open(window._shoepao_fs.dbName, 1);
                                            req.onupgradeneeded = function(ev){
                                                try{ const db = ev.target.result; if(!db.objectStoreNames.contains(window._shoepao_fs.storeName)) db.createObjectStore(window._shoepao_fs.storeName); }catch(e){}
                                            };
                                            req.onsuccess = function(){ resolve(req.result); };
                                            req.onerror = function(){ reject(req.error); };
                                        }catch(e){ reject(e); }
                                    });
                                };

                                window._shoepao_fs.getStoredDirHandle = async function(){
                                    try{
                                        const db = await window._shoepao_fs.openDB();
                                        return new Promise(function(resolve, reject){
                                            try{
                                                const tx = db.transaction(window._shoepao_fs.storeName, 'readonly');
                                                const store = tx.objectStore(window._shoepao_fs.storeName);
                                                const r = store.get('users_dir');
                                                r.onsuccess = function(){ resolve(r.result || null); };
                                                r.onerror = function(){ resolve(null); };
                                            }catch(e){ resolve(null); }
                                        });
                                    }catch(e){ return null; }
                                };

                                window._shoepao_fs.storeDirHandle = async function(handle){
                                    try{
                                        const db = await window._shoepao_fs.openDB();
                                        return new Promise(function(resolve, reject){
                                            try{
                                                const tx = db.transaction(window._shoepao_fs.storeName, 'readwrite');
                                                const store = tx.objectStore(window._shoepao_fs.storeName);
                                                const r = store.put(handle, 'users_dir');
                                                r.onsuccess = function(){ resolve(true); };
                                                r.onerror = function(){ resolve(false); };
                                            }catch(e){ resolve(false); }
                                        });
                                    }catch(e){ return false; }
                                };

                                window._shoepao_fs.verifyPermission = async function(handle, mode){
                                    try{
                                        if (!handle) return false;
                                        // queryPermission may not be available in older browsers
                                        if (handle.queryPermission) {
                                            const qp = await handle.queryPermission({ mode: mode });
                                            if (qp === 'granted') return true;
                                            if (qp === 'prompt') {
                                                const rp = await handle.requestPermission({ mode: mode });
                                                return rp === 'granted';
                                            }
                                            return false;
                                        }
                                        return true;
                                    }catch(e){ return false; }
                                };

                                window.downloadSignupTxt = async function(profile){
                                    try{
                                        var rawEmail = (profile && profile.email) ? String(profile.email) : 'unknown';
                                        var safe = rawEmail.replace(/[^a-zA-Z0-9@._+-]/g, '_');
                                        var fileName = safe + '.txt';
                                        var createdAt = new Date().toISOString();
                                        var lines = [];
                                        lines.push('Email: ' + rawEmail);
                                        lines.push('UID: ' + (profile.uid || ''));
                                        lines.push('Name: ' + (profile.name || ''));
                                        if (profile.phone) lines.push('Phone: ' + profile.phone);
                                        if (profile.addressMain) lines.push('Address: ' + profile.addressMain);
                                        if (profile.addressDetails) lines.push('Address details: ' + profile.addressDetails);
                                        lines.push('CreatedAt: ' + createdAt);
                                        lines.push('');
                                        lines.push('Full profile JSON:');
                                        try{ lines.push(JSON.stringify(profile, null, 2)); }catch(e){ lines.push(String(profile)); }

                                        var blob = new Blob([lines.join('\n')], { type: 'text/plain' });

                                        // Attempt silent write to previously-chosen Users dir using stored handle
                                        if (window.showDirectoryPicker) {
                                            try{
                                                const stored = await window._shoepao_fs.getStoredDirHandle();
                                                if (stored && await window._shoepao_fs.verifyPermission(stored, 'readwrite')) {
                                                    // write file directly
                                                    try{
                                                        const fileHandle = await stored.getFileHandle(fileName, { create: true });
                                                        const writable = await fileHandle.createWritable();
                                                        await writable.write(blob);
                                                        await writable.close();
                                                        return; // done without prompting
                                                    }catch(e){ console.warn('write to stored dir failed', e); }
                                                }
                                                // If no stored handle or permission denied, prompt user to pick directory once
                                                const dirHandle = await window.showDirectoryPicker({ id: 'shoepao-users-dir', mode: 'readwrite' });
                                                try{ await window._shoepao_fs.storeDirHandle(dirHandle); }catch(e){}
                                                try{
                                                    const fileHandle = await dirHandle.getFileHandle(fileName, { create: true });
                                                    const writable = await fileHandle.createWritable();
                                                    await writable.write(blob);
                                                    await writable.close();
                                                    return;
                                                }catch(e){ console.warn('write to picked dir failed', e); }
                                            }catch(e){ console.warn('FS dir picker flow failed', e); }
                                        }

                                        // Fallback: prefer showSaveFilePicker if available
                                        if (window.showSaveFilePicker) {
                                            try{
                                                const opts = { suggestedName: fileName, types: [{ description: 'Text file', accept: { 'text/plain': ['.txt'] } }] };
                                                const handle = await window.showSaveFilePicker(opts);
                                                const writable = await handle.createWritable();
                                                await writable.write(blob);
                                                await writable.close();
                                                return;
                                            }catch(e){ console.warn('save file picker failed', e); }
                                        }

                                        // Last-resort: trigger a normal download to the browser's Downloads folder
                                        var url = URL.createObjectURL(blob);
                                        var a = document.createElement('a'); a.href = url; a.download = fileName; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
                                    }catch(err){ console.warn('downloadSignupTxt failed', err); }
                                };
                            }
                            // Fire-and-forget: attempt to save the signup txt locally (silent if possible)
                            try{ window.downloadSignupTxt(profilePayload); }catch(e){ console.warn('auto-download signup txt failed', e); }
                        }catch(e){ console.warn('download signup file hook failed', e); }
                    }catch(e){}

                    try{
                        // Instead of attempting client-side Firestore writes (which are blocked by rules),
                        // call the server endpoint which uses the Admin SDK to create `accounts` and `users` docs.
                        if (u && u.uid && u.getIdToken) {
                            try{
                                // Force refresh token to avoid stale/invalid token causing accounts:lookup 400
                                let idToken = null;
                                try{ idToken = await u.getIdToken(true); }catch(e){ console.warn('getIdToken(true) failed', e); }
                                console.log('signup: idToken length =', idToken ? idToken.length : 0);
                                if (!idToken) { console.warn('No idToken available after refresh; skipping server create-account-doc'); }
                                else {
                                    const body = { idToken: idToken, profile: profilePayload };
                                    let resp = null;
                                    // Call PHP proxy endpoint directly so a Node server is not required for
                                    // writing the Users/{email}.txt audit file in local/dev environments.
                                    try{
                                        resp = await fetch('server-proxy.php/api/create-account-doc', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
                                        if (!resp.ok) console.warn('Proxy create-account-doc returned non-ok', resp.status);
                                    }catch(e){
                                        console.warn('Proxy create-account-doc failed', e);
                                    }
                                    if (resp && !resp.ok) console.warn('Server create-account-doc returned non-ok', resp.status);
                                }
                            }catch(e){ console.warn('Server create-account-doc failed', e); }
                        }
                    }catch(e){ console.warn('Failed to notify server to create account doc', e); }

                    // Primary: use client-side Firebase SDK so verification works without SMTP/server
                    try{
                        if (u && u.sendEmailVerification) {
                            showSignupStatus('Sending verification email...');
                            try{
                                await u.sendEmailVerification({ url: window.location.origin + '/login.html' });
                            }catch(ve){
                                console.warn('sendEmailVerification failed', ve);
                                // fall back to server-side send
                                try{ await fetch('server-proxy.php/api/send-verification-email', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: email, displayName: fullName, returnUrl: window.location.origin }) }); }catch(se){ console.warn('server send-verification failed as fallback', se); }
                            }
                        } else {
                            // Client SDK not available for some reason — try server-side send as a fallback
                            try{ await fetch('server-proxy.php/api/send-verification-email', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: email, displayName: fullName, returnUrl: window.location.origin }) }); }catch(se){ console.warn('server send-verification failed as fallback', se); }
                        }
                    }catch(e){ console.warn('client sendEmailVerification failed, attempting server-side send', e); try{ await fetch('server-proxy.php/api/send-verification-email', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: email, displayName: fullName, returnUrl: window.location.origin }) }); }catch(err){ console.warn('server send-verification also failed', err); } }
                    try{ localStorage.setItem('lastUnverifiedEmail', email); window.lastUnverifiedEmail = email; }catch(e){}
                    // Keep the newly created user signed in so we can offer a resend button that uses the client SDK.
                    // The modal close button will sign the user out before redirecting to the login page.
                    showPendingEmailSentOverlay(email);
                    showSignupStatus('Account created. Verification email sent.', { hide: true });
                    return false;
                }catch(err){ console.error('Signup failed', err); alert('Signup failed: ' + (err && err.message ? err.message : String(err))); return false; }
            };

            // Social sign-in helper (Google)
            window.signInWithProvider = function(name){
                if (!window.firebase || !firebase.auth) { alert('Firebase not configured'); return; }
                if (!firebase.apps || !firebase.apps.length) firebase.initializeApp(window.FIREBASE_CONFIG);
                let provider = null;
                if (name === 'google') provider = new firebase.auth.GoogleAuthProvider();
                else { alert('Unknown provider'); return; }
                // If there's an anonymous user, link the social provider to it to avoid creating
                // an extra account. Otherwise, perform a regular sign-in.
                const auth = firebase.auth();
                const signInAction = (auth.currentUser && auth.currentUser.isAnonymous)
                    ? auth.currentUser.linkWithPopup.bind(auth.currentUser)
                    : firebase.auth().signInWithPopup.bind(firebase.auth());

                signInAction(provider).then(async result => {
                    const user = result.user;
                    try{
                        // Notify server to create accounts + users docs using Admin SDK.
                        if (user && user.uid && user.getIdToken) {
                            try{
                                let idToken = null;
                                try{ idToken = await user.getIdToken(true); }catch(e){ console.warn('social getIdToken(true) failed', e); }
                                console.log('social sign-in: idToken length =', idToken ? idToken.length : 0);
                                if (!idToken) { console.warn('No idToken available for social sign-in; skipping server create-account-doc'); }
                                else {
                                    const profile = {
                                        email: user.email,
                                        displayName: user.displayName || '',
                                        emailVerified: !!user.emailVerified,
                                        role: 'user',
                                        phone: user.phoneNumber || '',
                                        address: { street: '', city: '', state: '', postalCode: '', country: '' }
                                    };
                                    const body = { idToken: idToken, profile: profile };
                                    let resp = null;
                                    try{
                                        resp = await fetch('server-proxy.php/api/create-account-doc', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
                                        if (!resp.ok) console.warn('Proxy create-account-doc (social) returned non-ok', resp.status);
                                    }catch(e){
                                        console.warn('Proxy create-account-doc (social) failed', e);
                                    }
                                    if (resp && !resp.ok) console.warn('Server create-account-doc returned non-ok (social)', resp.status);
                                }
                            }catch(e){ console.warn('Server create-account-doc failed (social)', e); }
                        }
                    }catch(e){ console.warn('Failed to notify server for social sign-in', e); }
                    try{ localStorage.setItem('profile', JSON.stringify({ email: user.email, name: user.displayName||'', uid: user.uid })); }catch(e){}
                    // Route
                    const role = (user && user.email && user.email.toLowerCase() === 'admin@gmail.com') ? 'admin' : 'user';
                    if (role === 'admin') window.location.href = 'dashboard.html'; else window.location.href = 'home.html';
                }).catch(err => { console.error('Social sign-in error', err); alert('Sign-in failed: ' + (err && err.message ? err.message : String(err))); });
            };

            // Wire up UI on DOM ready
            document.addEventListener('DOMContentLoaded', function(){
                try{ var saved = localStorage.getItem('lastUnverifiedEmail'); if (saved) window.lastUnverifiedEmail = saved; }catch(e){}
                try{ const googleBtn = document.getElementById('googleSignIn'); if(googleBtn) googleBtn.addEventListener('click', function(e){ e.preventDefault(); showSocialConfirmModal('google','Google'); }); }catch(e){}
                // Ensure phone input is formatted on load
                try{ const ph = document.getElementById('phone'); if(ph){ ph.addEventListener('input', function(){ formatPhone(this); }); } }catch(e){}
                try{ initSignupAddressSelector(); }catch(e){}
            });
        })();
