<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up - SHOEPAO</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: 'Montserrat', Arial, sans-serif;
            background: #fff;
            margin: 0;
            padding: 0;
        }
        .signup-wrapper {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            justify-content: center;
            min-height: 100vh;
            width: 100vw;
            position: relative;
            background: #fff;
            z-index: 1;
            gap: 13.2vw; /* Increase gap by 10% from previous 12vw */
        }
        .logo-section {
            display: flex;
            align-items: flex-start;
            justify-content: flex-end;
            min-width: 200px;
            max-width: 320px;
            margin-top: 116px; /* Reduce gap by 30% from previous 166px */
        }
        .logo-section img {
            width: 120px;
            height: auto;
        }
        .form-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 320px;
            max-width: 480px;
            margin-left: auto;
            margin-right: auto;
            margin-top: 116px; /* Reduce gap by 30% from previous 166px */
        }
        .signup-header {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 32px;
            color: #222;
        }
        .name-row {
            display: flex;
            gap: 16px;
            width: 100%;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            flex: 1;
        }
        .input-label {
            font-size: 0.98rem;
            color: #444;
            margin-bottom: 6px;
            font-weight: 500;
        }
        .input-box {
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            margin-bottom: 18px;
            background: #fff;
            outline: none;
            transition: border 0.2s;
        }
        .input-box:focus {
            border-color: #b71c1c;
        }
        .phone-row {
            position: relative;
            width: 100%;
        }
        .phone-prefix {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #444;
            font-size: 1rem;
            pointer-events: none;
            /* no extra spacing between prefix and input */
            margin-right: 0;
            letter-spacing: 0.5px;
        }
        /* decorative marker removed - no extra marker */
        .phone-input {
            border: none;
            outline: none;
            font-size: 1rem;
            background: transparent;
            flex: 1;
            letter-spacing: 2px;
            padding-left: 100px; /* reduced by 20px so gap is 20px smaller */
            height: 100%;
            text-align: left;
            z-index: 1;
            position: relative;
            top: 0;
            display: flex;
            align-items: center;
            padding-top: 0 !important;
            padding-bottom: 0 !important;
            margin-top: auto;
            margin-bottom: auto;
            box-sizing: border-box;
        }
        .password-row {
            width: 100%;
        }
        .password-label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .toggle-password {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            color: #888;
            font-size: 1rem;
            user-select: none;
        }
        .eye-icon {
            font-size: 1.1em;
        }
        .password-instruction {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 18px;
            margin-top: -10px;
        }
        .checkbox-row {
            display: flex;
            align-items: flex-start;
            margin-bottom: 10px;
        }
        .checkbox-row input[type="checkbox"] {
            margin-right: 8px;
            margin-top: 2px;
        }
        .checkbox-row label {
            font-size: 0.97rem;
            color: #222;
        }
        .checkbox-row a {
            text-decoration: underline;
            color: #222;
        }
        .signup-action-row {
            display: flex;
            align-items: center;
            margin-top: 28px;
            width: 100%;
        }
        .signup-btn {
            background: #000;
            color: #fff;
            border: none;
            border-radius: 24px;
            padding: 12px 36px;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            margin-right: 24px;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .signup-btn:hover {
            background: #b71c1c;
        }
        .login-link-row {
            font-size: 1rem;
            color: #222;
        }
        .login-link-row a {
            text-decoration: underline;
            color: #222;
            cursor: pointer;
        }
        @media (max-width: 900px) {
            .signup-wrapper {
                flex-direction: column;
                align-items: center;
            }
            .logo-section {
                padding-left: 0;
                justify-content: center;
            }
            .form-section {
                margin-left: 0;
                max-width: 100%;
            }
        }
        @media (min-width: 900px) {
            .signup-wrapper {
                position: absolute;
                top: 50%;
                left: 48%; /* Move wrapper 3% to the right from previous 45% */
                transform: translate(-50%, -50%);
                width: auto;
                min-width: 0;
            }
        }
        /* Social button styles — mirror login page */
        .social-auth { display:flex; gap:10px; margin:12px 0; }
        .social-btn { display:flex; align-items:center; gap:12px; padding:10px 14px; border-radius:6px; cursor:pointer; font-weight:600; font-size:0.98rem; border:0; }
        .social-btn img { width:32px; height:32px; object-fit:contain; }
        .social-btn.facebook { background:#3b5998; color:#fff; }
        .social-btn.facebook:hover { filter:brightness(0.95); }
        .social-btn.google { background:#fff; color:#111; border:2px solid #e0e0e0; }
        .social-btn.google:hover { box-shadow:0 1px 2px rgba(0,0,0,0.08); }
        .social-auth .social-btn { flex:1 1 0; justify-content:center; }
        .social-btn.disabled { opacity:0.6; pointer-events:none; }
    /* Verification overlay styles */
    .verification-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center; z-index:9999; }
    .verification-modal { background:#fff; padding:22px; border-radius:10px; max-width:520px; width:92%; box-shadow:0 8px 30px rgba(0,0,0,0.25); color:#111; }
    .verification-modal h3 { margin:0 0 8px 0; font-size:1.2rem; }
    .verification-modal p { margin:6px 0 12px 0; color:#444; }
    .verification-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:12px; }
    .verification-actions .btn { padding:8px 12px; border-radius:6px; border:0; cursor:pointer; }
    .btn-primary { background:#b71c1c; color:#fff; }
    .btn-outline { background:transparent; border:1px solid #ddd; color:#111; }
    </style>
</head>
<body>
    <div class="signup-wrapper">
        <div class="logo-section">
            <img src="IMAGE/SHOEPAOLOGO.png" alt="SHOEPAO Logo">
        </div>
        <form class="form-section" autocomplete="off" onsubmit="return handleSignup(event)">
            <div class="signup-header">Sign up now</div>
            <div class="social-auth">
                <button id="googleSignIn" class="social-btn google" type="button" aria-label="Sign up with Google">
                    <img src="IMAGE/googleicon.png" alt="Google logo" />
                    <span>Sign up with Google</span>
                </button>
            </div>
            <div class="name-row">
                <div class="input-group">
                    <label for="firstName" class="input-label">First name</label>
                    <input type="text" id="firstName" name="firstName" class="input-box" required>
                </div>
                <div class="input-group">
                    <label for="lastName" class="input-label">Last name</label>
                    <input type="text" id="lastName" name="lastName" class="input-box" required>
                </div>
            </div>
            <div class="input-group">
                <label for="email" class="input-label">Email address</label>
                <input type="email" id="email" name="email" class="input-box" required>
            </div>
            <div class="input-group">
                <label for="phone" class="input-label">Phone number</label>
                <div class="phone-row">
                    <span class="phone-prefix">+63</span>
                    <input type="text" id="phone" name="phone" class="phone-input" maxlength="12" pattern="[0-9]{3} [0-9]{3} [0-9]{4}" placeholder="xxx xxx xxxx" required oninput="formatPhone(this)">
                </div>
            </div>
            <div class="input-group">
                <label for="address" class="input-label">Address (street, barangay, city/province, postal code)</label>
                <textarea id="address" name="address" class="input-box" rows="3" placeholder="e.g. 123 Green St., Barangay 3, Quezon City, 1100"></textarea>
            </div>
            <div class="password-row">
                <div class="password-label-row">
                    <label for="password" class="input-label">Password</label>
                    <span class="toggle-password" onclick="togglePassword()" id="toggleIcon"><span class="eye-icon">&#128065;</span> Hide</span>
                </div>
                <input type="password" id="password" name="password" class="input-box" required>
            </div>
            <div class="password-instruction">Use 8 or more characters with a mix of letters, numbers & symbols</div>
            <div class="checkbox-row">
                <input type="checkbox" id="terms" required>
                <label for="terms">By creating an account, I agree to our <a href="#">Terms of use</a> and <a href="#">Privacy Policy</a></label>
            </div>
            <div class="checkbox-row">
                <input type="checkbox" id="consent">
                <label for="consent">By creating an account, I am also consenting to receive SMS messages and emails, including product new feature updates, events, and marketing promotions.</label>
            </div>
            <div class="signup-action-row">
                <button type="submit" class="signup-btn">Sign up</button>
                <div class="login-link-row">Already have an account? <a href="login.html">Log in</a></div>
            </div>
        </form>
    </div>
    <!-- Shared Firebase config and SDKs -->
    <script src="js/firebase-config.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <script>
function togglePassword() {
    const passwordInput = document.getElementById('password');
    const toggleIcon = document.getElementById('toggleIcon');
    if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleIcon.innerHTML = '<span class="eye-icon">&#128065;</span> Show';
    } else {
        passwordInput.type = 'password';
        toggleIcon.innerHTML = '<span class="eye-icon">&#128065;</span> Hide';
    }
}
function formatPhone(input) {
    // Format as 3-3-4 (xxx xxx xxxx)
    let value = input.value.replace(/\D/g, '');
    let formatted = '';
    if (value.length > 0) {
        formatted += value.substring(0,3);
    }
    if (value.length > 3) {
        formatted += ' ' + value.substring(3,6);
    }
    if (value.length > 6) {
        formatted += ' ' + value.substring(6,10);
    }
    input.value = formatted;
}
function handleSignup(e){
    e.preventDefault();
    (async function(){
        const firstName = (document.getElementById('firstName').value||'').trim();
        const lastName = (document.getElementById('lastName').value||'').trim();
        const email = (document.getElementById('email').value||'').trim().toLowerCase();
        const phone = (document.getElementById('phone').value||'').trim();
        const password = (document.getElementById('password').value||'');
        const addressVal = (document.getElementById('address') ? document.getElementById('address').value : '').trim();
        const addressMain = addressVal.split('\n')[0] || addressVal;
        const addressDetails = addressVal.split('\n').slice(1).join(', ') || '';
        if(!email || !password){ alert('Please enter email and password'); return; }

        // If Firebase is configured, don't create/send verification yet.
        // Save the pending signup payload and redirect to a dedicated verification page
        // where the user chooses email verification or SMS (OTP). That page will
        // create the Firebase user and perform the selected verification action.
        if(window.FIREBASE_CONFIG && window.firebase && window.firebase.auth){
            try{
                const pending = { email, password, firstName, lastName, phone, addressMain, addressDetails };
                try { localStorage.setItem('pending_signup', JSON.stringify(pending)); } catch(e) { console.warn('Could not persist pending signup in localStorage', e); }
                window.location.href = 'verification.html';
            }catch(err){ console.error('Signup redirect error', err); alert('Signup failed: ' + (err && err.message ? err.message : String(err))); }
            return;
        }

        // Fallback local storage path (legacy)
        try{
            var users = JSON.parse(localStorage.getItem('users')||'[]')||[];
            var existing = users.find(u => (u.email||'').toLowerCase() === email);
            if(existing){ existing.firstName = firstName || existing.firstName; existing.lastName = lastName || existing.lastName; existing.name = ((existing.firstName||'') + (existing.lastName?(' ' + existing.lastName):'')).trim() || existing.name; existing.phone = phone || existing.phone; if(password) existing.password = password; if(addressMain) existing.addressMain = addressMain; if(addressDetails) existing.addressDetails = addressDetails; }
            else { var newUser = { email, password, firstName, lastName, name: ((firstName||'') + (lastName?(' ' + lastName):'')).trim(), phone, role:'user', registeredAt: Date.now() }; if(addressMain) newUser.addressMain = addressMain; if(addressDetails) newUser.addressDetails = addressDetails; users.push(newUser); }
            localStorage.setItem('users', JSON.stringify(users));
            try{ localStorage.setItem('profile', JSON.stringify({ name: (firstName + (lastName ? (' ' + lastName) : '')).trim() || '', email, phone, addressMain: addressMain || '', addressDetails: addressDetails || '' })); localStorage.setItem('profile_updated_at', String(Date.now())); }catch(e){}
            try{ var t = 'local:' + btoa(String(email||'') + ':' + String(Date.now())); localStorage.setItem('authToken', t); localStorage.setItem('authTokenUpdatedAt', String(Date.now())); window.AUTH_TOKEN = t; }catch(e){}
        }catch(e){ console.warn('Could not save new user (local fallback)', e); }
        window.location.href = 'home.html';
    })();
}
// --- Social sign-in handlers (copied/adapted from login.html) ---
function getQueryParam(name) {
    try{ var params = new URLSearchParams(window.location.search); return params.get(name); }catch(e){ return null; }
}

function signInWithProvider(name) {
    try {
        if (!window.firebase || !firebase.auth) { alert('Firebase not configured'); return; }
        let provider = null;
        if (name === 'google') provider = new firebase.auth.GoogleAuthProvider();
        else { alert('Unknown provider'); return; }
        firebase.auth().signInWithPopup(provider).then(result => {
            const user = result.user;
            // create/merge profile in Firestore for social sign-ins
            try {
                if (window.firebase && firebase.firestore && user && user.uid) {
                    if (!firebase.apps || !firebase.apps.length) firebase.initializeApp(window.FIREBASE_CONFIG);
                    const userDoc = firebase.firestore().doc('users/' + user.uid);
                    const payload = { email: user.email, displayName: user.displayName || '', emailVerified: !!user.emailVerified, role: 'user', lastLoginAt: firebase.firestore.FieldValue.serverTimestamp() };
                    userDoc.set(payload, { merge: true }).catch(() => {});
                }
            } catch (e) { console.warn('Failed to upsert social sign-in user doc', e); }
            const profile = { email: user.email, name: user.displayName || '', uid: user.uid, provider: (user.providerData && user.providerData[0] && user.providerData[0].providerId) || '' };
            try { localStorage.setItem('profile', JSON.stringify(profile)); localStorage.setItem('profile_updated_at', String(Date.now())); } catch (e) {}
            try{
                if(user && user.getIdToken){
                    user.getIdToken().then(function(token){
                        try{ localStorage.setItem('authToken', token); localStorage.setItem('authTokenUpdatedAt', String(Date.now())); }catch(e){}
                        try{ window.AUTH_TOKEN = token; }catch(e){}
                    }).catch(function(){});
                }
            }catch(e){}
            const ret = getQueryParam('return'); if (ret) { try{ window.location.href = decodeURIComponent(ret); return; } catch(e){} }
            // Basic routing
            const role = (user.email && user.email.toLowerCase() === 'admin@gmail.com') ? 'admin' : 'user';
            if (role === 'admin') window.location.href = 'dashboard.html'; else window.location.href = 'home.html';
        }).catch(err => {
            console.error('Social sign-in error', err);
            alert('Social sign-in failed: ' + (err && err.message ? err.message : String(err)));
        });
    } catch (e) { console.error('signInWithProvider', e); }
}

function initFirebaseAuthHandlers() {
    try {
        if (!window.FIREBASE_CONFIG || !window.firebase) return;
        if (!firebase.apps || !firebase.apps.length) firebase.initializeApp(window.FIREBASE_CONFIG);
        const googleBtn = document.getElementById('googleSignIn');
        if (googleBtn) googleBtn.addEventListener('click', (e) => { e.preventDefault(); signInWithProvider('google'); });
        const updateSocialButtons = () => {
            const ok = (window.FIREBASE_CONFIG && window.firebase && firebase.auth);
            const b = googleBtn;
            if (!b) return;
            if (ok) { b.classList.remove('disabled'); b.disabled = false; b.title = ''; }
            else { b.classList.add('disabled'); b.disabled = true; b.title = 'Firebase not configured or providers not enabled'; }
        };
        updateSocialButtons();
    } catch (e) { console.warn('initFirebaseAuthHandlers failed', e); }
}

document.addEventListener('DOMContentLoaded', function(){
    try { var saved = localStorage.getItem('lastUnverifiedEmail'); if (saved) window.lastUnverifiedEmail = saved; } catch(e){}
    try { initFirebaseAuthHandlers(); } catch(e){}
});

// Show a blocking overlay that instructs the user to verify their email.
// It polls by attempting to sign in with the provided email/password and checking emailVerified.
function showVerificationOverlay(email, password, meta) {
    try {
        // Create DOM elements
        const overlay = document.createElement('div'); overlay.className = 'verification-overlay';
        const modal = document.createElement('div'); modal.className = 'verification-modal';
        modal.innerHTML = '<h3>Verify your email</h3>' +
            '<p>We sent a verification link to <strong>' + (email || '') + '</strong>. Please check your inbox (and spam).\nAfter you click the link, return here and click "I verified" or wait for automatic detection.</p>' +
            '<div style="font-size:0.9rem;color:#666;margin-top:6px;">To protect your account we won\'t proceed until the email is verified.</div>';

    const statusEl = document.createElement('div'); statusEl.style = 'margin-top:10px;color:#444;font-size:0.95rem;min-height:22px;';
    modal.appendChild(statusEl);
    const actions = document.createElement('div'); actions.className = 'verification-actions';
    const resendBtn = document.createElement('button'); resendBtn.className = 'btn btn-outline'; resendBtn.textContent = 'Resend verification';
    const checkBtn = document.createElement('button'); checkBtn.className = 'btn btn-outline'; checkBtn.textContent = 'I verified — check now';
    const resetBtn = document.createElement('button'); resetBtn.className = 'btn btn-outline'; resetBtn.textContent = 'Reset password'; resetBtn.style.display = 'none';
    const closeBtn = document.createElement('button'); closeBtn.className = 'btn btn-primary'; closeBtn.textContent = 'Cancel';
    actions.appendChild(resendBtn); actions.appendChild(checkBtn); actions.appendChild(resetBtn); actions.appendChild(closeBtn);
        modal.appendChild(actions);
        overlay.appendChild(modal);
        document.body.appendChild(overlay);

        // Prevent leaving the page casually
        const beforeUnloadHandler = function(e){ e.preventDefault(); e.returnValue = ''; return ''; };
        window.addEventListener('beforeunload', beforeUnloadHandler);

        let stopped = false;
        let attempts = 0;
        let intervalMs = 8000;
        async function doCheck() {
            if (stopped) return;
            if (!window.firebase || !firebase.auth) return;
            attempts++;
            statusEl.textContent = 'Checking verification status... (attempt ' + attempts + ')';
            try {
                // Try to sign in with provided credentials to refresh user record
                if (!password) {
                    statusEl.textContent = 'Password not available in this session. Please sign in from the login page to resend verification or reset your password.';
                    stopped = true; clearInterval(intervalId); return;
                }
                await firebase.auth().signInWithEmailAndPassword(email, password);
                const u = firebase.auth().currentUser;
                if (!u) { statusEl.textContent = 'Unable to get user session. Retrying...'; return; }
                await u.reload();
                if (u.emailVerified) {
                    // Verified — clean up and route to home
                    stopped = true;
                    try {
                        // Build payload including any metadata provided during signup
                        const payload = Object.assign({}, (meta || {}));
                        payload.email = u.email;
                        payload.displayName = u.displayName || payload.displayName || '';
                        payload.emailVerified = true;
                        payload.lastLoginAt = firebase.firestore.FieldValue.serverTimestamp();
                        // Ensure role and createdAt exist for new users
                        if (!payload.role) payload.role = 'user';
                        if (!payload.createdAt) payload.createdAt = firebase.firestore.FieldValue.serverTimestamp();
                        await firebase.firestore().doc('users/' + u.uid).set(payload, { merge: true });
                    } catch(e){ console.warn('Failed to upsert user doc after verification', e); }
                    try { localStorage.setItem('profile', JSON.stringify({ email: u.email, name: u.displayName || (meta && (meta.firstName || '') + ' ' + (meta.lastName || '')) || '', uid: u.uid })); localStorage.setItem('profile_updated_at', String(Date.now())); } catch(e){}
                    try{
                        if(u && u.getIdToken){
                            u.getIdToken().then(function(token){
                                try{ localStorage.setItem('authToken', token); localStorage.setItem('authTokenUpdatedAt', String(Date.now())); }catch(e){}
                                try{ window.AUTH_TOKEN = token; }catch(e){}
                            }).catch(function(){});
                        }
                    }catch(e){}
                    // remove overlay and handler
                    window.removeEventListener('beforeunload', beforeUnloadHandler);
                    if (overlay && overlay.parentNode) overlay.parentNode.removeChild(overlay);
                    // route
                    const role = (u.email && u.email.toLowerCase() === 'admin@gmail.com') ? 'admin' : 'user';
                    if (role === 'admin') window.location.href = 'dashboard.html'; else window.location.href = 'home.html';
                } else {
                    // sign out so UI doesn't hold an unverified session
                    try { await firebase.auth().signOut(); } catch(e){}
                    statusEl.textContent = 'Email still unverified. Waiting for confirmation...';
                }
            } catch (err) {
                // Handle common auth errors and stop retrying for non-recoverable ones
                const code = err && err.code ? err.code : null;
                const msg = err && err.message ? err.message : String(err);
                console.warn('Verification check attempt failed (will retry):', code, msg);
                if (code === 'auth/wrong-password') {
                    statusEl.textContent = 'The password provided is incorrect. Click "Reset password" to receive a password reset email.';
                    resetBtn.style.display = '';
                    stopped = true; clearInterval(intervalId); window.removeEventListener('beforeunload', beforeUnloadHandler);
                    return;
                }
                if (code === 'auth/user-not-found') {
                    statusEl.textContent = 'No account found for this email. Please register again or contact support.';
                    stopped = true; clearInterval(intervalId); window.removeEventListener('beforeunload', beforeUnloadHandler);
                    return;
                }
                if (code === 'auth/user-disabled') {
                    statusEl.textContent = 'This user account has been disabled. Contact support.';
                    stopped = true; clearInterval(intervalId); window.removeEventListener('beforeunload', beforeUnloadHandler);
                    return;
                }
                // transient errors: network, too-many-requests — back off exponentially up to some limit
                if (code === 'auth/too-many-requests' || code === 'auth/network-request-failed' || attempts < 6) {
                    statusEl.textContent = 'Temporary error checking verification. Retrying in a few seconds...';
                    // increase interval for exponential backoff
                    intervalMs = Math.min(60000, intervalMs * 1.8);
                    clearInterval(intervalId);
                    setInterval(doCheck, intervalMs);
                    return;
                }
                // Unknown error: stop retrying and surface message
                statusEl.textContent = 'Unable to automatically verify your email right now: ' + msg + '. Please try again later or contact support.';
                stopped = true; clearInterval(intervalId); window.removeEventListener('beforeunload', beforeUnloadHandler);
            }
        }

        // Periodic poll every 8 seconds
        const intervalId = setInterval(doCheck, 8000);

        // Immediate check when clicking "I verified"
        checkBtn.addEventListener('click', async function(){ try { await doCheck(); } catch(e){} });

        // Reset password handler
        resetBtn.addEventListener('click', async function(){
            try {
                if (!email) { alert('No email available'); return; }
                if (!window.firebase || !firebase.auth) { alert('Firebase not available'); return; }
                await firebase.auth().sendPasswordResetEmail(email, { url: window.location.origin + '/login.html' });
                alert('Password reset email sent. Please check your inbox.');
            } catch (err) { console.error('sendPasswordResetEmail failed', err); alert('Failed to send password reset: ' + (err && err.message ? err.message : String(err))); }
        });

        // Resend handler: if password is available, sign in briefly and use client SDK's sendEmailVerification
        resendBtn.addEventListener('click', async function(){
            try {
                if (window.firebase && firebase.auth) {
                    if (!email) { alert('No email available to resend to'); return; }
                    if (!password) {
                        alert('Password not available. Please go to the login page and request a verification resend from there.');
                        return;
                    }
                    try {
                        // Sign in to obtain a valid idToken/currentUser, then call sendEmailVerification
                        const res = await firebase.auth().signInWithEmailAndPassword(email, password);
                        const u = res.user || firebase.auth().currentUser;
                        if (u && u.sendEmailVerification) {
                            await u.sendEmailVerification({ url: window.location.origin + '/signup.html' });
                            alert('Verification email sent. Please check your inbox and spam folder.');
                        } else {
                            alert('Could not send verification email using Firebase SDK.');
                        }
                        try { await firebase.auth().signOut(); } catch(e){}
                        return;
                    } catch (err) {
                        console.warn('Client resend via signIn failed', err);
                        alert('Could not resend verification automatically. Please sign in and request a verification email from your account settings or the login page.');
                        try { await firebase.auth().signOut(); } catch(e){}
                        return;
                    }
                }
                // If Firebase SDK not available, fall back to instructing the user
                alert('Firebase not configured in this browser. Please check your internet connection or try again.');
            } catch(e) { console.error('resend verification error', e); alert('Failed to resend verification'); }
        });

        // Cancel/close overlay (user chooses to stop signup flow)
        closeBtn.addEventListener('click', function(){ stopped = true; clearInterval(intervalId); window.removeEventListener('beforeunload', beforeUnloadHandler); if (overlay && overlay.parentNode) overlay.parentNode.removeChild(overlay); });

        // Start with an immediate check attempt (in case verification was instant)
        setTimeout(doCheck, 800);

    } catch (e) { console.error('showVerificationOverlay error', e); alert('Unable to show verification overlay: ' + (e && e.message ? e.message : String(e))); }
}
</script>
    <!-- Footer removed on signup page per UX request -->
</body>
</html>
